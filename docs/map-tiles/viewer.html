<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- tools/map-stitch.py が作る絵を確かめるページ（ゲームとは別）。中身は Artifact で公開したものと同じ -->
<title>新しい地図のつなぎ目</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 地図をいっぱいに：上に道具の帯、真ん中に動かせる地図、下に全体の小さな地図 */
:root{
  --bg:#efeadf; --panel:#fbf8f1; --ink:#2b2a26; --sub:#6c675c; --line:#d8d0bf;
  --accent:#b8462e; --seam:#0f9fd8; --blur:#e0a01e; --frame:#3157c9; --chip:#e7e0d1;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b19; --panel:#262521; --ink:#ece6da; --sub:#a59e90; --line:#3b3934;
  --accent:#e2775c; --seam:#3cc4f5; --blur:#f2b843; --frame:#8aa6ff; --chip:#33312c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1b19; --panel:#262521; --ink:#ece6da; --sub:#a59e90; --line:#3b3934;
  --accent:#e2775c; --seam:#3cc4f5; --blur:#f2b843; --frame:#8aa6ff; --chip:#33312c; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);margin:0;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--chip);cursor:pointer;user-select:none;border:1px solid transparent}
.chip input{margin:0;accent-color:var(--accent)}
.chip .sw{width:12px;height:3px;border-radius:2px;display:inline-block}
.chip:focus-within{border-color:var(--accent)}
button,select{font-family:var(--f-ui);font-size:13px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.zoom{font-family:var(--f-num);font-size:12px;color:var(--sub);min-width:58px;text-align:right}
input[type=range]{width:90px;accent-color:var(--accent)}
#view{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:var(--bg)}
#view.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world img{position:absolute;left:0;top:0;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
#world svg{position:absolute;left:0;top:0;overflow:visible}
.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:12px;align-items:center;pointer-events:none}
.hud .num{font-family:var(--f-num)}
.scale{display:flex;flex-direction:column;gap:2px}
.scale i{display:block;height:4px;background:var(--ink);border-radius:1px}
#mini{height:74px;position:relative;border-top:1px solid var(--line);background:var(--panel);cursor:pointer;flex:none}
#mini img{height:100%;width:100%;object-fit:fill;display:block;max-width:none}
#mini .box{position:absolute;border:2px solid var(--accent);box-sizing:border-box;pointer-events:none}
.note{font-size:12px;color:var(--sub)}
@media (max-width:640px){.bar h1{font-size:14px}.note{display:none}#mini{height:52px}}
@media (prefers-reduced-motion:reduce){#world{transition:none!important}}
</style>

<div class="bar">
  <h1>新しい地図のつなぎ目</h1>
  <div class="grp" role="group" aria-label="重ねるもの">
    <label class="chip"><input type="checkbox" id="L-seam" checked><span class="sw" style="background:var(--seam)"></span>つなぎ目</label>
    <label class="chip"><input type="checkbox" id="L-blur" checked><span class="sw" style="background:var(--blur)"></span>ぼかした所</label>
    <label class="chip"><input type="checkbox" id="L-rail"><span class="sw" style="background:var(--accent)"></span>線路と駅</label>
    <label class="chip"><input type="checkbox" id="L-frame"><span class="sw" style="background:var(--frame)"></span>タイルの枠</label>
    <label class="chip"><input type="checkbox" id="L-sketch">下絵 <input type="range" id="sketchOp" min="10" max="90" value="45" aria-label="下絵の濃さ"></label>
  </div>
  <div class="grp">
    <select id="jump" aria-label="駅へ移動"><option value="">駅へ…</option></select>
    <button id="seamNext" title="つなぎ目を順に見る">次のつなぎ目 ›</button>
    <button id="zout" aria-label="縮小">−</button><button id="zin" aria-label="拡大">＋</button><button id="fit">全体</button>
    <span class="zoom" id="zl">100%</span>
  </div>
  <span class="note">ドラッグで移動・ホイールやピンチで拡大。絵は1マス＝2px（1km＝200px）</span>
</div>
<div id="view" aria-label="つないだ地図。ドラッグで移動、ホイールで拡大">
  <div id="world">
    <img id="art" src="stitched.jpg" width="6200" height="2000" alt="ChatGPT で描いたタイル16枚をつないだ、みなと川沿線の絵地図">
    <img id="sketch" src="sketch.svg" width="6200" height="2000" alt="" hidden>
    <svg id="ov" width="6200" height="2000" viewBox="-700 0 3100 1000" aria-hidden="true"></svg>
  </div>
  <div class="hud"><div class="scale"><i id="sbar"></i><span id="slab" class="num">1 km</span></div><span id="pos" class="num">—</span></div>
</div>
<div id="mini" title="押した所へ移動"><img src="stitched.jpg" alt=""><div class="box" id="mbox"></div></div>

<script>
(function(){
  var X0=-700, W=6200, H=2000, PX=2;
  var view=document.getElementById('view'), world=document.getElementById('world'), ov=document.getElementById('ov');
  var st={s:0.3,x:0,y:0}, minS=0.1, maxS=3;
  var seams=[], blurred=[], tiles=[], stations={};
  var NS='http://www.w3.org/2000/svg';
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
  var G={seam:el('g',{id:'g-seam'},ov),blur:el('g',{id:'g-blur'},ov),rail:el('g',{id:'g-rail'},ov),frame:el('g',{id:'g-frame'},ov)};
  function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

  function apply(){
    var vw=view.clientWidth, vh=view.clientHeight, w=W*st.s, h=H*st.s;
    st.x = w<vw ? (vw-w)/2 : Math.min(0,Math.max(vw-w,st.x));
    st.y = h<vh ? (vh-h)/2 : Math.min(0,Math.max(vh-h,st.y));
    world.style.transform='translate('+st.x+'px,'+st.y+'px) scale('+st.s+')';
    document.getElementById('zl').textContent=Math.round(st.s*100)+'%';
    var km=200*st.s, k=1; while(km*k<60)k*=2; while(km*k>180&&k>0.25)k/=2;
    document.getElementById('sbar').style.width=(km*k)+'px';
    document.getElementById('slab').textContent=(k<1?k.toFixed(2):k)+' km';
    var stroke=1.6/(st.s*PX); ov.style.setProperty('--sw',stroke);
    ov.querySelectorAll('[data-w]').forEach(function(e){e.setAttribute('stroke-width',e.dataset.w*stroke);});
    ov.querySelectorAll('text').forEach(function(t){t.setAttribute('font-size',13/(st.s*PX));t.setAttribute('stroke-width',3/(st.s*PX));});
    ov.querySelectorAll('circle[data-r]').forEach(function(c){c.setAttribute('r',c.dataset.r/(st.s*PX));});
    var m=document.getElementById('mini'), mw=m.clientWidth, mh=m.clientHeight, b=document.getElementById('mbox');
    b.style.left=Math.max(0,-st.x/w*mw)+'px'; b.style.top=Math.max(0,-st.y/h*mh)+'px';
    b.style.width=Math.min(mw,vw/w*mw)+'px'; b.style.height=Math.min(mh,vh/h*mh)+'px';
  }
  function zoomAt(ns,cx,cy){ns=Math.max(minS,Math.min(maxS,ns));var wx=(cx-st.x)/st.s, wy=(cy-st.y)/st.s;st.s=ns;st.x=cx-wx*ns;st.y=cy-wy*ns;apply();}
  /* はじめは縦いっぱい（横にスクロールして本線をたどる）。「全体」は横いっぱい */
  function fill(){minS=Math.min(view.clientWidth/W,view.clientHeight/H);st.s=view.clientHeight/H;st.x=-(ST0()-X0)*PX*st.s+view.clientWidth/2;st.y=0;apply();}
  function ST0(){return stations.C?stations.C.x:0;}
  function fit(){minS=Math.min(view.clientWidth/W,view.clientHeight/H);st.s=minS;st.x=0;st.y=(view.clientHeight-H*st.s)/2;apply();}
  function goWorld(ux,uy,s){st.s=s||Math.max(st.s,1);st.x=view.clientWidth/2-(ux-X0)*PX*st.s;st.y=view.clientHeight/2-uy*PX*st.s;apply();}

  /* ドラッグ・ピンチ */
  var pts=new Map(), last=null;
  view.addEventListener('pointerdown',function(e){view.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});view.classList.add('drag');last=null;});
  view.addEventListener('pointermove',function(e){
    var r=view.getBoundingClientRect(), ux=(e.clientX-r.left-st.x)/st.s/PX+X0, uy=(e.clientY-r.top-st.y)/st.s/PX;
    document.getElementById('pos').textContent='中央から '+(ux/100).toFixed(2)+' km';
    if(!pts.has(e.pointerId))return;
    var p=pts.get(e.pointerId);
    if(pts.size===1){st.x+=e.clientX-p.x;st.y+=e.clientY-p.y;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});apply();return;}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    var a=Array.from(pts.values()), d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), cx=(a[0].x+a[1].x)/2-r.left, cy=(a[0].y+a[1].y)/2-r.top;
    if(last){st.x+=cx-last.cx;st.y+=cy-last.cy;zoomAt(st.s*d/last.d,cx,cy);}
    last={d:d,cx:cx,cy:cy};
  });
  function up(e){pts.delete(e.pointerId);last=null;if(!pts.size)view.classList.remove('drag');}
  view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
  view.addEventListener('wheel',function(e){e.preventDefault();var r=view.getBoundingClientRect();zoomAt(st.s*Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
  view.addEventListener('dblclick',function(e){var r=view.getBoundingClientRect();zoomAt(st.s*2,e.clientX-r.left,e.clientY-r.top);});
  document.getElementById('zin').onclick=function(){zoomAt(st.s*1.5,view.clientWidth/2,view.clientHeight/2);};
  document.getElementById('zout').onclick=function(){zoomAt(st.s/1.5,view.clientWidth/2,view.clientHeight/2);};
  document.getElementById('fit').onclick=fit;
  document.getElementById('mini').addEventListener('click',function(e){var r=this.getBoundingClientRect();
    var ux=(e.clientX-r.left)/r.width*W/PX+X0, uy=(e.clientY-r.top)/r.height*H/PX;goWorld(ux,uy,st.s<0.6?1:st.s);});
  window.addEventListener('resize',apply);

  /* 重ねるもの */
  function vis(){
    G.seam.style.display=document.getElementById('L-seam').checked?'':'none';
    G.blur.style.display=document.getElementById('L-blur').checked?'':'none';
    G.rail.style.display=document.getElementById('L-rail').checked?'':'none';
    G.frame.style.display=document.getElementById('L-frame').checked?'':'none';
    var sk=document.getElementById('sketch');sk.hidden=!document.getElementById('L-sketch').checked;
    sk.style.opacity=document.getElementById('sketchOp').value/100;
  }
  ['L-seam','L-blur','L-rail','L-frame','L-sketch','sketchOp'].forEach(function(id){document.getElementById(id).addEventListener('input',vis);});

  var si=-1;
  document.getElementById('seamNext').onclick=function(){if(!seams.length)return;si=(si+1)%seams.length;var s=seams[si],p=s.pts[Math.floor(s.pts.length/2)];
    document.getElementById('L-seam').checked=true;vis();goWorld(p[0],p[1],1.2);
    this.textContent='次のつなぎ目 › '+(si+1)+'/'+seams.length;};
  document.getElementById('jump').onchange=function(){var s=stations[this.value];if(s)goWorld(s.x,s.y,1.2);};

  function draw(){
    var sc=css('--seam'), bc=css('--blur'), ac=css('--accent'), fc=css('--frame'), ink=css('--panel');
    seams.forEach(function(s){el('polyline',{points:s.pts.map(function(p){return p.join(',');}).join(' '),fill:'none',stroke:sc,'data-w':1.4,'stroke-dasharray':'4 3',opacity:.9},G.seam);});
    blurred.forEach(function(b){el('rect',{x:b[0]-4,y:b[1]-4,width:b[2]+8,height:b[3]+8,rx:3,fill:'none',stroke:bc,'data-w':2},G.blur);});
    var keys=Object.keys(stations), main=['C','S','U','M','K','N','P'], br=['K','F','T','O'];
    [main,br].forEach(function(l){el('polyline',{points:l.filter(function(k){return stations[k];}).map(function(k){return stations[k].x+','+stations[k].y;}).join(' '),fill:'none',stroke:ac,'data-w':2.2,opacity:.85},G.rail);});
    keys.forEach(function(k){var s=stations[k];el('circle',{cx:s.x,cy:s.y,'data-r':5,fill:ink,stroke:ac,'data-w':1.6},G.rail);
      var t=el('text',{x:s.x,y:s.y-8,'text-anchor':'middle',fill:ac,stroke:ink,'paint-order':'stroke','font-weight':700,'font-family':'Zen Kaku Gothic New, sans-serif'},G.rail);t.textContent=s.name;});
    tiles.forEach(function(t){el('rect',{x:t.x0,y:t.y0,width:t.x1-t.x0,height:t.y1-t.y0,fill:'none',stroke:fc,'data-w':1,opacity:.8},G.frame);
      var tx=el('text',{x:t.x0+4,y:t.band==='north'?t.y0+14:t.y1-6,fill:fc,stroke:ink,'paint-order':'stroke','font-weight':700,'font-family':'IBM Plex Mono, monospace'},G.frame);tx.textContent=t.id+' '+t.name;});
    apply();
  }
  Promise.all([fetch('seams.json').then(function(r){return r.json();}),fetch('tiles.json').then(function(r){return r.json();})]).then(function(a){
    seams=a[0].seams||[];blurred=a[0].blurred||[];tiles=a[1].tiles||[];stations=a[1].stations||{};
    var sel=document.getElementById('jump');Object.keys(stations).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=stations[k].name;sel.appendChild(o);});
    draw();vis();fill();
  }).catch(function(){document.getElementById('pos').textContent='つなぎ目の印を読めませんでした（絵だけ表示）';});
  fill();vis();
  requestAnimationFrame(fill);
})();
</script>

</head></html>
