<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アイデア帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 中身は ideas.md（ここでは読みこんで表示するだけ）。方眼のノートのような台紙 */
:root{
  --paper:#eef1f2;--sheet:#fbfcfc;--ink:#18263a;--muted:#5d6a78;--line:#cfd6dc;--line2:#e2e7ea;--rail:#c23b3b;--focus:#2f5d8a;--ok:#2e7d4f;
  --f-disp:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11161c;--sheet:#182029;--ink:#e3e9ee;--muted:#9aa8b5;--line:#2c3742;--line2:#222c36;--rail:#e2615c;--focus:#7fb0de;--ok:#5fbf86;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#11161c;--sheet:#182029;--ink:#e3e9ee;--muted:#9aa8b5;--line:#2c3742;--line2:#222c36;--rail:#e2615c;--focus:#7fb0de;--ok:#5fbf86;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px 22px;
  background-image:linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% 28px;background-position:0 12px}
@media (max-width:520px){.sheet{padding:14px 14px}}
h1{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0 0 6px;letter-spacing:.03em}
h2{font-size:18px;margin:26px 0 6px;padding-top:6px;border-top:3px solid var(--rail);display:inline-block}
h3{font-size:15.5px;margin:18px 0 4px}
h3 .st{font-size:12px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;color:var(--muted);white-space:nowrap}
h3 .st.next{background:var(--rail);border-color:var(--rail);color:#fff}
h3 .st.doing{color:var(--ok);border-color:var(--ok)}
p{margin:6px 0}
ul{margin:4px 0 8px;padding-left:1.3em}
li{margin:2px 0}
hr{border:0;margin:8px 0}
code{font-family:var(--f-num);font-size:.88em;background:var(--paper);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
a{color:var(--focus)}
.top{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--muted)}
.top a{min-height:36px;display:inline-flex;align-items:center}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.toc a{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;text-decoration:none;color:var(--ink);background:var(--sheet);min-height:32px;display:inline-flex;align-items:center}
.err{color:var(--rail)}
.tw{overflow-x:auto;margin:6px 0 10px}
table{border-collapse:collapse;font-size:13.5px;background:var(--sheet);min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
th{font-weight:700;white-space:nowrap}
td.r,th.r{text-align:right;white-space:nowrap;font-family:var(--f-num)}
.sum{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13.5px;background:var(--paper);padding:8px 0;margin:4px 0 6px;border-bottom:1px solid var(--line)}
.sum b{font-family:var(--f-num)}
.sum button,.note button,#bundle button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}
.sum button{border-color:var(--focus);color:var(--focus);font-weight:700}
.note{margin:4px 0 14px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);font-size:13.5px;line-height:1.6}
.note .row,#bundle .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note .lbl{color:var(--muted);font-size:12.5px;margin-right:2px}
.note button[aria-pressed="true"]{background:var(--focus);border-color:var(--focus);color:#fff}
.note button.done[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.note textarea,#bundle textarea{width:100%;min-height:64px;margin-top:6px;font:inherit;font-size:14px;line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--sheet);color:var(--ink);box-sizing:border-box}
.note .meta,#bundle .meta{font-size:12px;color:var(--muted);margin-top:4px}
#bundle{margin:18px 0 0}#bundle[hidden]{display:none}
#bundle textarea{min-height:220px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../index.html">← みなと川電鉄 ダイヤ工房へ</a><span>中身は <code>docs/ideas.md</code>。印とコメントは、この端末のブラウザにだけ一時保存されます</span></div>
  <div class="sum" id="sum" aria-live="polite"></div>
  <article class="sheet" id="doc"><p class="muted">読みこんでいます…</p></article>
  <section class="sheet" id="bundle" hidden></section>
</div>
<script>
(function(){
'use strict';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>{if(/^(javascript|data):/i.test(u))return t;const href=/^https?:|^\.|^\//.test(u)?u:u.replace(/\.md$/,'.html');return `<a href="${href}"${/^https?:/.test(u)?' target="_blank" rel="noopener"':''}>${t}</a>`;});
  return s;}
function status(h){ // 見出しの最後の「状態」を札にする
  const m=h.match(/^(.*?)[\s　]+(\*\*次にやる\*\*|次にやる|すすめている.*|まだ.*|できた.*)$/);if(!m)return inline(h);
  const st=m[2].replace(/\*\*/g,'');const cls=st.startsWith('次')?' next':st.startsWith('すすめ')?' doing':'';
  return inline(m[1])+`<span class="st${cls}">${esc(st)}</span>`;}
function table(rows){const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  const head=cells(rows[0]);const sep=rows[1]&&/^\|?[\s:|-]+\|?$/.test(rows[1])?cells(rows[1]):null;
  const al=(sep||[]).map(x=>/:$/.test(x)?' class="r"':'');const body=rows.slice(sep?2:1).map(cells);
  return `<div class="tw"><table><thead><tr>${head.map((h,i)=>`<th${al[i]||''}>${inline(h)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map((c,i)=>`<td${al[i]||''}>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function render(md){const out=[];const toc=[];let list=false,para=[],tbl=[];
  const flush=()=>{if(tbl.length){out.push(table(tbl));tbl=[];}if(para.length){out.push('<p>'+inline(para.join(''))+'</p>');para=[];}if(list){out.push('</ul>');list=false;}};
  for(const raw of md.split(/\r?\n/)){const l=raw.replace(/\s+$/,'');
    if(/^\s*\|/.test(l)){if(para.length||list){const t=tbl;tbl=[];flush();tbl=t;}tbl.push(l.trim());continue;}
    if(tbl.length){out.push(table(tbl));tbl=[];}
    if(!l.trim()){flush();continue;}
    let m;
    if(m=l.match(/^(#{1,3})\s+(.*)$/)){flush();const lv=m[1].length;
      if(lv===2){const id='s'+toc.length;toc.push([id,m[2]]);out.push(`<h2 id="${id}">${inline(m[2])}</h2>`);}
      else if(lv===3)out.push('<h3>'+status(m[2])+'</h3>');else out.push('<h1>'+inline(m[2])+'</h1>');continue;}
    if(/^---+$/.test(l)){flush();out.push('<hr>');continue;}
    if(m=l.match(/^\s*[-*]\s+(.*)$/)){if(para.length){out.push('<p>'+inline(para.join(''))+'</p>');para=[];}if(!list){out.push('<ul>');list=true;}out.push('<li>'+inline(m[1])+'</li>');continue;}
    if(list&&/^\s{2,}/.test(raw)){out[out.length-1]=out[out.length-1].replace(/<\/li>$/,inline(l.trim())+'</li>');continue;}
    para.push(l.trim());}
  flush();
  const h1=out.findIndex(x=>x.startsWith('<h1>'));
  const tocHtml=toc.length?`<nav class="toc" aria-label="目次">${toc.map(([id,t])=>`<a href="#${id}">${inline(t.replace(/（.*?）/g,''))}</a>`).join('')}</nav>`:'';
  if(h1>=0)out.splice(h1+1,0,tocHtml);else out.unshift(tocHtml);
  return out.join('\n');}
const KEY='dia-ideas-notes';
let notes={};try{notes=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){notes={};}
const putNotes=()=>{try{localStorage.setItem(KEY,JSON.stringify(notes));}catch(e){}};
const today=()=>new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric'});
const getNote=k=>notes[k]||(notes[k]={mark:'',text:'',sent:''});
const markWord=m=>m==='done'?'解答済み':m==='todo'?'未着手':'未チェック';
const titleOf=h=>[...h.childNodes].filter(n=>!(n.nodeType===1&&n.classList.contains('st'))).map(n=>n.textContent).join('').trim();
const boxes=()=>[...document.querySelectorAll('#doc .note')];
function paint(box){const n=notes[box.dataset.k]||{mark:'',text:'',sent:''};
  box.querySelectorAll('button[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(n.mark===b.dataset.v)));
  const c=!(n.text||'').trim()?'コメントなし':n.sent?'チャットに送信済み（'+n.sent+'）':'未送信（この端末に一時保存）';
  box.querySelector('.meta').textContent='印：'+markWord(n.mark)+'　／　コメント：'+c;}
function sumAll(){let todo=0,done=0,none=0,draft=0;
  boxes().forEach(b=>{const n=notes[b.dataset.k]||{};if(n.mark==='todo')todo++;else if(n.mark==='done')done++;else none++;if((n.text||'').trim()&&!n.sent)draft++;});
  const sum=document.getElementById('sum');
  sum.innerHTML='<span>未着手 <b>'+todo+'</b></span><span>解答済み <b>'+done+'</b></span><span>未チェック <b>'+none+'</b></span><span>未送信のコメント <b>'+draft+'</b></span><button type="button" id="mk">チャット用の文章を作る</button>';
  document.getElementById('mk').onclick=makeBundle;}
function enhance(){document.querySelectorAll('#doc h3').forEach(h=>{
  const k=titleOf(h);if(!k)return;
  const box=document.createElement('div');box.className='note';box.dataset.k=k;
  box.innerHTML='<div class="row"><span class="lbl">あなたの印</span><button type="button" data-v="todo">未着手</button><button type="button" class="done" data-v="done">解答済み</button></div>'
    +'<textarea placeholder="コメント（入力すると、この端末に一時保存されます）"></textarea><div class="meta"></div>';
  box.querySelector('textarea').setAttribute('aria-label','コメント：'+k);
  const ta=box.querySelector('textarea');ta.value=(notes[k]||{}).text||'';
  box.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{const n=getNote(k);n.mark=n.mark===b.dataset.v?'':b.dataset.v;putNotes();paint(box);sumAll();});
  ta.oninput=()=>{const n=getNote(k);n.text=ta.value;n.sent='';putNotes();paint(box);sumAll();};
  h.after(box);paint(box);});
  sumAll();}
function makeBundle(){
  const items=boxes().map(b=>({k:b.dataset.k,n:notes[b.dataset.k]||{}})).filter(x=>x.n.mark||((x.n.text||'').trim()&&!x.n.sent));
  const bd=document.getElementById('bundle');bd.hidden=false;
  if(!items.length){bd.innerHTML='<h2>チャット用の文章</h2><p class="meta">印を付けたか、コメントを書いた項目がありません。</p>';return;}
  const body=items.map(({k,n})=>'■ '+k+'\n  印：'+(n.mark?markWord(n.mark):'（印なし）')+((n.text||'').trim()&&!n.sent?'\n  コメント：'+n.text.trim():'')).join('\n\n');
  const txt='【アイデア帳へのコメント（'+today()+'）】\n\n'+body;
  bd.innerHTML='<h2>チャットに貼る文章</h2><p class="meta">コピーすると、ここに出したコメントは「送信済み」になります。印はそのまま残ります。</p>'
    +'<textarea id="btxt" readonly></textarea><div class="row"><button type="button" id="bcopy">コピーして送信済みにする</button></div>';
  const t=document.getElementById('btxt');t.value=txt;
  document.getElementById('bcopy').onclick=async()=>{let ok=false;
    try{await navigator.clipboard.writeText(txt);ok=true;}catch(e){t.select();try{ok=document.execCommand('copy');}catch(_){ok=false;}}
    const btn=document.getElementById('bcopy');
    if(!ok){btn.textContent='コピーできませんでした。文章を選んで手でコピーしてください';return;}
    items.forEach(({k,n})=>{if((n.text||'').trim()&&!n.sent)notes[k].sent=today();});
    putNotes();boxes().forEach(paint);sumAll();btn.textContent='コピーしました（コメントを送信済みにしました）';};
  bd.scrollIntoView({behavior:'smooth',block:'start'});}
fetch('ideas.md',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text();})
 .then(md=>{document.getElementById('doc').innerHTML=render(md);enhance();if(location.hash){const t=document.querySelector(location.hash);if(t)t.scrollIntoView();}})
 .catch(()=>{document.getElementById('doc').innerHTML='<p class="err">アイデア帳（ideas.md）を読めませんでした。GitHub Pages か、ローカルのサーバー（python3 -m http.server）で開いてください。</p>';});
})();
</script>
</body>
</html>
