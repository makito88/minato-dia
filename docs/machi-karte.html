<style>

:root{

:root[data-theme="dark"]{--paper:#11161c;--sheet:#182029;--ink:#e3e9ee;--muted:#9aa8b5;--line:#2c3742;--line2:#222c36;--rail:#e2615c;--focus:#7fb0de;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(22px,4vw,30px);letter-spacing:.04em;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:13px;margin:0;color:var(--muted);letter-spacing:.06em;font-weight:700}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px}

.route .st{cursor:pointer}

.note{font-size:12px;color:var(--muted);margin-top:18px;max-width:80ch}

<div class="wrap">
  <h1>みなと川沿線 街のカルテ</h1>
  <p class="lede">沿線10駅のまわり（半径約1km）にどんな施設がいくつあるか、駅がどの市町村にあり、その市町村の人口・財政・お金の流れがどうなっているかをまとめた架空の設定です。</p>
  <div class="tabs" role="tablist" id="tabs">
    <button data-v="station" aria-pressed="true">駅と施設</button>
    <button data-v="towns" aria-pressed="false">市町村</button>
    <button data-v="money" aria-pressed="false">お金の流れ</button>
    <button data-v="table" aria-pressed="false">施設の一覧表</button>
  </div>
  <section class="sheet scroll" id="routeBox" aria-label="路線図"><svg class="route" id="route" viewBox="0 0 900 250" role="img" aria-label="駅を選ぶ路線図"></svg></section>
  <section id="v-station"></section>
  <section id="v-towns" hidden></section>
  <section id="v-money" hidden></section>
  <section id="v-table" hidden></section>
  <p class="note">すべて架空の街の設定です（実在の市町村・施設とは関係ありません）。1日の乗車人数だけはゲームの標準ダイヤ・平日・秋・晴れのシミュレーション結果です。施設の数は駅から半径約1km、市町村の数値は1年分（お金は億円）の目安です。</p>
</div>

/* ---- 路線図 ---- */
const POS={C:[60,180],S:[165,180],U:[270,180],M:[375,180],K:[480,180],N:[610,180],P:[740,180],F:[560,120],T:[650,72],O:[790,40]};
function drawRoute(){const g=[];
  // 市町村の色帯（線の下）
  const band=(a,b,t,y)=>{const [x1]=POS[a],[x2]=POS[b];g.push(`<rect x="${x1-38}" y="${y}" width="${x2-x1+76}" height="8" rx="4" fill="${TW[t].color}" opacity=".85"/>`);};
  band('C','U','minato',214);band('M','K','midorino',214);band('N','N','nitta',214);band('P','P','minatohama',214);
  const lab=(x,t)=>g.push(`<text class="lbl" x="${x}" y="240" text-anchor="middle" fill="${TW[t].color}">${TW[t].name}</text>`);
  lab((POS.C[0]+POS.U[0])/2,'minato');lab((POS.M[0]+POS.K[0])/2,'midorino');lab(POS.N[0],'nitta');lab(POS.P[0],'minatohama');
  // 支線の市町村
  g.push(`<path d="M${POS.F[0]-10} ${POS.F[1]+34} L${POS.T[0]+34} ${POS.T[1]+34}" stroke="${TW.morishita.color}" stroke-width="8" stroke-linecap="round" opacity=".85"/>`);
  g.push(`<text class="lbl" x="${POS.T[0]+44}" y="${POS.T[1]+56}" fill="${TW.morishita.color}">${TW.morishita.name}</text>`);
  g.push(`<rect x="${POS.O[0]-34}" y="${POS.O[1]+32}" width="68" height="8" rx="4" fill="${TW.yunotani.color}" opacity=".85"/><text class="lbl" x="${POS.O[0]}" y="${POS.O[1]+56}" text-anchor="middle" fill="${TW.yunotani.color}">${TW.yunotani.name}</text>`);
  // 線路
  g.push(`<path d="M${POS.C[0]} 180 L${POS.P[0]} 180" stroke="var(--ink)" stroke-width="5" fill="none"/>`);
  g.push(`<path d="M${POS.K[0]} 180 L${POS.F[0]} ${POS.F[1]} L${POS.T[0]} ${POS.T[1]} L${POS.O[0]} ${POS.O[1]}" stroke="var(--ink)" stroke-width="5" fill="none" stroke-linejoin="round"/>`);
  for(const s of ORD){const [x,y]=POS[s],up=y<180;
    g.push(`<g class="st${s===cur.st?' on':''}" data-st="${s}" tabindex="0" role="button" aria-label="${S[s].name}駅"><circle cx="${x}" cy="${y}" r="${S[s].tags[0]==='ターミナル'||s==='K'||s==='P'||s==='O'?9:7}"/>
      <text x="${x}" y="${up?y-16:y-18}" text-anchor="middle">${S[s].name}</text><text class="k" x="${x}" y="${up?y+24:y+24}" text-anchor="middle">${fmt(S[s].board)}人/日</text></g>`);}
  $('#route').innerHTML=g.join('');}
$('#route').addEventListener('click',e=>{const g=e.target.closest('[data-st]');if(!g)return;cur.st=g.dataset.st;cur.town=S[cur.st].town;render();});

      <h3 style="margin-top:16px">この駅らしさ</h3><p class="hint">沿線10駅の合計のうち、この駅のまわりにある割合が高い施設</p>
      <div class="feat">${feat.map(({f,sh})=>`<span>${esc(f.item)}<b>${Math.round(sh*100)}%</b></span>`).join('')}</div></div>
    <div class="sheet"><h2>駅のまわりの施設</h2><p class="hint">半径約1km。棒の長さは、沿線でいちばん多い駅を100としたときの多さ</p><div class="fac" style="margin-top:10px">${fac}</div></div></div>`;
  $('#v-station [data-town]').addEventListener('click',()=>{cur.town=st.town;setView('towns');});}

/* ---- 市町村 ---- */
const REVC=['#2f5d8a','#6b8fb8','#9fb8d2','#c98a54','#b9c2cb'],EXPC=['#a5533f','#d08b5b','#7a9a5a','#4f8a86','#c9a33f','#8aa04a','#7d6a9a','#8c96a1','#c3cad1'];
function stackBar(obj,cols){const tot=Object.values(obj).reduce((a,b)=>a+b,0),ks=Object.keys(obj);
  return `<div class="stack">${ks.map((k,i)=>`<span style="width:${obj[k]/tot*100}%;background:${cols[i%cols.length]}" title="${esc(k)} ${fmt(obj[k],1)}億円"></span>`).join('')}</div>
    <div class="legend">${ks.map((k,i)=>`<span><i style="background:${cols[i%cols.length]}"></i>${esc(k)}<b>${fmt(obj[k],obj[k]<10?1:0)}</b></span>`).join('')}</div>`;}
function towns(){const ks=Object.keys(TW),t=TW[cur.town],tot=Object.values(t.rev).reduce((a,b)=>a+b,0),maxPop=Math.max(...ks.map(k=>TW[k].pop));
  const sel=`<div class="tsel">${ks.map(k=>`<button data-k="${k}" aria-pressed="${k===cur.town}"><i style="background:${TW[k].color}"></i>${esc(TW[k].name)}</button>`).join('')}</div>`;
  const pops=ks.map(k=>`<div class="popbar"><span>${esc(TW[k].name)}</span><span class="b" style="width:${Math.max(0.6,TW[k].pop/maxPop*100)}%;background:${TW[k].color}"></span><span class="num" style="text-align:right">${fmt(TW[k].pop)}人</span></div>`).join('');
  const cmpRows=ks.map(k=>{const x=TW[k],rv=Object.values(x.rev).reduce((a,b)=>a+b,0);return `<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${x.color};margin-right:6px"></i>${esc(x.name)}</td>
    <td class="n">${fmt(x.area,1)}</td><td class="n">${fmt(x.pop/x.area)}</td><td class="n">${fmt(x.age[2],1)}%</td><td class="n" style="color:${x.chg5<0?'var(--rail)':'inherit'}">${x.chg5>0?'+':''}${fmt(x.chg5,1)}%</td>
    <td class="n">${fmt(x.dayNight,1)}</td><td class="n">${fmt(rv,rv<100?1:0)}</td><td class="n">${fmt(rv*1e8/x.pop/1e4,1)}</td><td class="n">${fmt(x.fiscal,2)}</td><td class="n">${fmt(x.tourists)}</td></tr>`;}).join('');
  const sts=t.stations.map(s=>`<button class="tag" style="cursor:pointer;background:none" data-st="${s}">${esc(S[s].name)}駅</button>`).join('');
  const kv=[['人口',fmt(t.pop),'人'],['世帯',fmt(t.hh),'世帯'],['面積',fmt(t.area,1),'k㎡'],['人口密度',fmt(t.pop/t.area),'人/k㎡'],['5年間の人口の増減',(t.chg5>0?'+':'')+fmt(t.chg5,1),'%'],['昼夜間人口比率',fmt(t.dayNight,1),'（100より大きいと昼に人が集まる）'],
    ['市町村内総生産',fmt(t.gdp),'億円'],['1人あたり所得',fmt(t.incomePc),'万円'],['観光客',fmt(t.tourists),'万人/年'],['宿泊者',fmt(t.stays,1),'万人/年'],['財政力指数',fmt(t.fiscal,2),'（1に近いほど自前の税で回せる）'],['貯金（基金）',fmt(t.fund),'億円'],['借金（地方債残高）',fmt(t.debt),'億円'],['公共施設',fmt(t.facilities),'か所']];
  $('#v-towns').innerHTML=`<div class="sheet" style="margin-top:16px">${sel}
    <div class="sthead"><span class="nm" style="font-size:28px">${esc(t.name)}</span><span class="chip" style="background:${t.color}">${esc(t.kind)}</span><span>${sts}</span></div>
    <p style="margin:8px 0 0;max-width:70ch">${esc(t.note)}</p>
    <dl class="kv">${kv.map(([k,v,u])=>`<div><dt>${k}</dt><dd><span class="num">${v}</span><small>${u}</small></dd></div>`).join('')}</dl>
    <div class="grid2"><div><h3>年齢の構成</h3>${stackBar({'0〜14歳':t.age[0],'15〜64歳':t.age[1],'65歳以上':t.age[2]},['#7fb0de','#2f5d8a','#c98a54']).replace(/<b>([\d.]+)<\/b>/g,'<b>$1%</b>')}
      <h3 style="margin-top:12px">働く人の産業</h3>${stackBar({'農林漁業':t.ind[0],'工業・建設':t.ind[1],'商業・サービス':t.ind[2]},['#7a9a5a','#8c96a1','#c9a33f']).replace(/<b>([\d.]+)<\/b>/g,'<b>$1%</b>')}</div>
      <div><h3>1年の収入（歳入 ${fmt(tot,tot<100?1:0)}億円・住民1人あたり ${fmt(tot*1e8/t.pop/1e4,1)}万円）</h3>${stackBar(t.rev,REVC)}
      <h3 style="margin-top:12px">1年の支出（歳出）</h3>${stackBar(t.exp,EXPC)}</div></div></div>
    <div class="sheet" style="margin-top:16px"><h2>6つの市町村をくらべる</h2><div style="margin-top:10px">${pops}</div>
    <div class="scroll" style="margin-top:12px"><table class="cmp"><thead><tr><th>市町村</th><th>面積k㎡</th><th>人口密度</th><th>高齢化率</th><th>5年の増減</th><th>昼夜間比</th><th>歳入億円</th><th>1人あたり万円</th><th>財政力</th><th>観光客万人</th></tr></thead><tbody>${cmpRows}</tbody></table></div></div>`;
  $('#v-towns').querySelectorAll('.tsel button').forEach(b=>b.addEventListener('click',()=>{cur.town=b.dataset.k;render();}));
  $('#v-towns').querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>{cur.st=b.dataset.st;setView('station');}));}

/* ---- お金の流れ（払う側→受け取る側のサンキー図） ---- */
const KC={'給料（通勤）':'#2f5d8a','買い物・飲食':'#c98a54','観光の消費':'#a5533f','港と物流':'#2f8a86','交付税・補助金':'#7d6a9a','運賃':'#c23b3b','給料（電鉄の社員）':'#5d8ac2','税金（固定資産税など）':'#8c96a1'};
function money(){const kinds=Object.keys(KC);if(!cur.kinds)cur.kinds=new Set(kinds);
  const F=DATA.flows.filter(f=>cur.kinds.has(f.kind));
  const L=[...new Set(F.map(f=>f.src))],R=[...new Set(F.map(f=>f.dst))];
  const sum=(arr,key,n)=>arr.filter(f=>f[key]===n).reduce((a,f)=>a+f.v,0);
  const W=900,gap=8,x0=230,x1=W-230,nw=12;
  const tl=L.reduce((a,n)=>a+sum(F,'src',n),0),tr=R.reduce((a,n)=>a+sum(F,'dst',n),0);
  const sc=560/Math.max(tl,tr,1);   // 小さい流れも名前が重ならないよう、名前の高さぶんの場所は必ずとる
  const place=(names,key)=>{let y=10;const o={};names.sort((a,b)=>sum(F,key,b)-sum(F,key,a)).forEach(n=>{const h=Math.max(2,sum(F,key,n)*sc);o[n]={y,h,off:0};y+=Math.max(h,30)+gap;});o._end=y;return o;};
  const NL=place(L,'src'),NR=place(R,'dst');const H=Math.max(NL._end,NR._end)+6;delete NL._end;delete NR._end;const g=[];
  F.slice().sort((a,b)=>b.v-a.v).forEach((f,i)=>{const h=Math.max(1,f.v*sc),a=NL[f.src],b=NR[f.dst],ya=a.y+a.off,yb=b.y+b.off;a.off+=h;b.off+=h;const xm=(x0+nw+x1)/2;
    g.push(`<path data-s="${esc(f.src)}" data-d="${esc(f.dst)}" fill="${KC[f.kind]}" d="M${x0+nw},${ya} C${xm},${ya} ${xm},${yb} ${x1},${yb} L${x1},${yb+h} C${xm},${yb+h} ${xm},${ya+h} ${x0+nw},${ya+h}Z"><title>${esc(f.src)} → ${esc(f.dst)}：${esc(f.kind)} ${fmt(f.v,f.v<10?1:0)}億円/年</title></path>`);});
  for(const [n,o] of Object.entries(NL))g.push(`<rect data-n="${esc(n)}" x="${x0}" y="${o.y}" width="${nw}" height="${o.h}" fill="var(--ink)"/><text x="${x0-8}" y="${o.y+Math.max(o.h,30)/2-6}" text-anchor="end" dominant-baseline="middle">${esc(n)}</text><text class="v" x="${x0-8}" y="${o.y+Math.max(o.h,30)/2+8}" text-anchor="end" dominant-baseline="middle">${fmt(sum(F,'src',n))}億円</text>`);
  for(const [n,o] of Object.entries(NR))g.push(`<rect data-n="${esc(n)}" x="${x1}" y="${o.y}" width="${nw}" height="${o.h}" fill="var(--ink)"/><text x="${x1+nw+8}" y="${o.y+Math.max(o.h,30)/2-6}" dominant-baseline="middle">${esc(n)}</text><text class="v" x="${x1+nw+8}" y="${o.y+Math.max(o.h,30)/2+8}" dominant-baseline="middle">${fmt(sum(F,'dst',n))}億円</text>`);
  const list=F.slice().sort((a,b)=>b.v-a.v).map(f=>`<tr><td>${esc(f.src)}</td><td>→ ${esc(f.dst)}</td><td style="text-align:left"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${KC[f.kind]};margin-right:5px"></i>${esc(f.kind)}</td><td class="num">${fmt(f.v,f.v<10?1:0)}</td></tr>`).join('');
  $('#v-money').innerHTML=`<div class="sheet" style="margin-top:16px"><h2>だれが、だれに、お金を払っているか（1年・億円）</h2>
    <p class="hint">左が払う側、右が受け取る側。帯の太さが金額。帯や名前にふれると、その流れが強調されます。${esc(DATA.rail.note)}</p>
    <div class="kinds">${kinds.map(k=>`<button data-k="${esc(k)}" aria-pressed="${cur.kinds.has(k)}"><i style="background:${KC[k]}"></i>${esc(k)}</button>`).join('')}</div>
    <div class="scroll"><svg class="sankey" viewBox="0 0 ${W} ${H}" role="img" aria-label="お金の流れの図">${g.join('')}</svg></div>
    <h3 style="margin-top:14px">流れの一覧</h3><div class="scroll"><table><thead><tr><th>払う側</th><th>受け取る側</th><th style="text-align:left">種類</th><th>億円/年</th></tr></thead><tbody>${list}</tbody></table></div>
    <p class="hint">みなと川電鉄の運賃収入 <span class="num">${fmt(DATA.rail.fareTotal,1)}</span>億円/年（平均運賃${DATA.rail.avgFare}円）・社員${fmt(DATA.rail.staff)}人</p></div>`;
  const svg=$('#v-money svg');const hl=n=>svg.querySelectorAll('path').forEach(p=>{const on=!n||p.dataset.s===n||p.dataset.d===n;p.classList.toggle('dim',!on);p.classList.toggle('hi',!!n&&on);});
  svg.addEventListener('mouseover',e=>{const p=e.target.closest('path,rect');if(!p)return;if(p.tagName==='rect')hl(p.dataset.n);else{svg.querySelectorAll('path').forEach(q=>{q.classList.toggle('dim',q!==p);q.classList.toggle('hi',q===p);});}});
  svg.addEventListener('mouseleave',()=>hl(null));svg.addEventListener('click',e=>{const r=e.target.closest('rect');hl(r?r.dataset.n:null);});
  $('#v-money').querySelectorAll('.kinds button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;if(cur.kinds.has(k)){if(cur.kinds.size>1)cur.kinds.delete(k);}else cur.kinds.add(k);money();}));}

/* ---- 施設の一覧表 ---- */
function table(){let rows='',last='';
  for(const f of DATA.facilities){if(f.genre!==last){rows+=`<tr><td class="g sticky" colspan="1">${esc(f.genre)}</td>${ORD.map(()=>'<td class="g"></td>').join('')}<td class="g"></td></tr>`;last=f.genre;}
    const m=rowMax(f);rows+=`<tr><td class="sticky">${esc(f.item)}<span style="color:var(--muted);font-size:11px">（${esc(f.unit)}）</span></td>${ORD.map(s=>{const v=f.v[s],a=m?v/m:0,c=TW[S[s].town].color;
      return `<td class="v" style="background:${v?`color-mix(in srgb, ${c} ${Math.round(8+a*62)}%, transparent)`:'transparent'};${a>0.6?'color:#fff;':''}${v?'':'color:var(--muted)'}">${v?fmt(v):'·'}</td>`;}).join('')}<td class="v">${fmt(rowSum(f))}</td></tr>`;}
  $('#v-table').innerHTML=`<div class="sheet" style="margin-top:16px"><h2>駅ごとの施設の数</h2><p class="hint">色の濃さは、その施設が沿線でいちばん多い駅を100としたときの多さ。色は駅が属する市町村</p>
    <div class="scroll" style="margin-top:8px"><table class="heat"><thead><tr><th class="sticky">施設</th>${ORD.map(s=>`<th>${esc(S[s].name)}</th>`).join('')}<th>沿線合計</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}

function setView(v){cur.view=v;try{history.replaceState(null,'','#'+v);}catch(e){}render();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['station','towns','money','table'].includes(h)&&h!==cur.view){cur.view=h;render();}});
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===cur.view)));
  for(const v of ['station','towns','money','table'])$('#v-'+v).hidden=v!==cur.view;
  $('#routeBox').hidden=!(cur.view==='station');drawRoute();
  ({station,towns,money,table})[cur.view]();}
render();
</script>

</body>
</html>
