<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>みなと川沿線 街のカルテ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 路線図と役所の統計書の中間：白い台紙に、市町村ごとの色帯で沿線を区切る。数字は等幅で右そろえ */
:root{
  --paper:#eef1f2;--sheet:#fbfcfc;--ink:#18263a;--muted:#5d6a78;--line:#cfd6dc;--line2:#e2e7ea;--rail:#c23b3b;--focus:#2f5d8a;
  --f-disp:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11161c;--sheet:#182029;--ink:#e3e9ee;--muted:#9aa8b5;--line:#2c3742;--line2:#222c36;--rail:#e2615c;--focus:#7fb0de;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#11161c;--sheet:#182029;--ink:#e3e9ee;--muted:#9aa8b5;--line:#2c3742;--line2:#222c36;--rail:#e2615c;--focus:#7fb0de;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(22px,4vw,30px);letter-spacing:.04em;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:13px;margin:0;color:var(--muted);letter-spacing:.06em;font-weight:700}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px}
.tabs button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px}
.scroll{overflow-x:auto}
.route{min-width:640px;display:block;width:100%;height:auto}
.route .st{cursor:pointer}
.route .st text{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--f-body)}
.route .st .k{fill:var(--muted);font-size:10px;font-weight:400}
.route .st circle{fill:var(--sheet);stroke:var(--ink);stroke-width:2.5}
.route .st.on circle{fill:var(--rail);stroke:var(--rail)}
.route .lbl{font-size:11px;font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.sthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.sthead .nm{font-family:var(--f-disp);font-size:34px;line-height:1.1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 7px;font-size:12px;color:var(--muted);margin:0 4px 4px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px;margin-top:12px}
.kv div{border-top:1px solid var(--line2);padding-top:6px}
.kv dt{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.kv dd{margin:0;font-size:18px;font-weight:700}
.kv dd small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
ul.lm{margin:6px 0 0;padding-left:1.2em}
.fac{display:grid;gap:14px}
.fgroup h3{margin-bottom:4px}
.frow{display:grid;grid-template-columns:minmax(0,9em) 4.6em minmax(0,1fr);gap:8px;align-items:center;padding:2px 0;font-size:13px}
.frow.zero{color:var(--muted);opacity:.55}
.frow .c{text-align:right}
.frow .c small{color:var(--muted);font-size:10.5px;margin-left:2px}
.bar{height:7px;border-radius:3px;background:var(--line2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.feat{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.feat span{background:var(--line2);border-radius:5px;padding:2px 8px;font-size:12.5px}
.feat b{font-family:var(--f-num);font-weight:500;margin-left:4px}
.tsel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tsel button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tsel button i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tsel button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
table{border-collapse:collapse;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11.5px;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--sheet)}
.cmp td.n{font-family:var(--f-num)}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:6px 0 4px}
.stack span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend b{color:var(--ink);font-family:var(--f-num);font-weight:500;margin-left:3px}
.popbar{display:grid;grid-template-columns:7em minmax(0,1fr) 6.5em;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.popbar .b{height:12px;border-radius:3px}
.sankey{min-width:760px;width:100%;height:auto;display:block}
.sankey text{fill:var(--ink);font-size:12px;font-family:var(--f-body)}
.sankey .v{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.sankey path{fill-opacity:.32;transition:fill-opacity .15s}
.sankey path.dim{fill-opacity:.06}.sankey path.hi{fill-opacity:.62}
.sankey rect{cursor:pointer}
.kinds{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.kinds button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.kinds button i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.kinds button[aria-pressed="false"]{opacity:.45}
.port{margin-top:16px}
.port .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:12px 0}
.port .tile{border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.port .tile dt{font-size:11.5px;color:var(--muted)}.port .tile dd{margin:2px 0 0;font-size:22px;font-weight:700;font-family:var(--f-num)}.port .tile dd small{font-size:11px;color:var(--muted);font-family:var(--f-body);font-weight:400;margin-left:4px}
.port .tile .d{font-size:12px;font-family:var(--f-num)}.port .up{color:#2f8a4a}.port .dn{color:#c9573f}
.sankey3{min-width:720px;width:100%;height:auto;display:block}
.sankey3 text{fill:var(--ink);font-size:12px;font-family:var(--f-body);paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.sankey3 .v{fill:var(--muted);font-family:var(--f-num);font-size:11px}.sankey3 .grp{font-weight:700;font-size:12.5px}
.sankey3 path{fill-opacity:.34;transition:fill-opacity .15s}.sankey3 path.dim{fill-opacity:.05}.sankey3 path.hi{fill-opacity:.7}
.sankey3 rect{cursor:pointer}
.whatif{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.whatif button{font:inherit;font-size:13px;border:1px dashed var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer;min-height:36px}
.whatif button[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.wnote{font-size:12.5px;margin:4px 0 0;display:grid;gap:2px}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.co{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;background:var(--sheet)}
.co[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.co h4{margin:0;font-size:15px}.co .w{font-size:12px;color:var(--muted)}.co p{margin:0;font-size:12.5px}.co .rl{color:var(--muted);font-size:12px}
.co .st{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#c9bfb6}.co .st i{display:block;height:100%;background:#2f8a4a}
.pday{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:12.5px;color:var(--muted)}.pday b{font-family:var(--f-num);color:var(--ink);font-size:16px;margin:0 2px 0 4px}
.jump{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer;margin-top:6px}
.ibar{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.ibar .b{height:10px;border-radius:3px;background:var(--line2);position:relative;overflow:hidden}.ibar .b i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.ibar .n{font-family:var(--f-num);text-align:right}.ibar.worst span:first-child{color:var(--rail);font-weight:700}
.big{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}.big div{display:grid}.big b{font-family:var(--f-num);font-size:30px;line-height:1.1}.big small{font-size:11.5px;color:var(--muted)}
.voices{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}.voices li{font-size:13px;background:var(--line2);border-radius:8px;padding:6px 10px;position:relative}.voices li::before{content:"“";color:var(--muted);margin-right:3px}
.scat{width:100%;max-width:520px;height:auto;display:block}.scat text{font-size:11px;fill:var(--ink);font-family:var(--f-body)}.scat .ax{fill:var(--muted)}
.hy-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 6px}
.hy-year{font-family:var(--f-disp);font-size:44px;line-height:1;min-width:3.2em}
.hy-ctl input[type=range]{flex:1 1 260px;accent-color:var(--rail);min-height:32px}
.hy-play{font:inherit;font-weight:700;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:36px}
.eras{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 10px}
.eras button{flex:0 0 auto;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:4px 9px;cursor:pointer;text-align:left;line-height:1.35}
.eras button small{display:block;color:var(--muted);font-family:var(--f-num);font-size:10.5px}
.eras button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}.eras button[aria-pressed="true"] small{color:var(--sheet);opacity:.75}
.hy-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px;align-items:start}@media (max-width:760px){.hy-top{grid-template-columns:1fr}}
.plate{margin:6px 0 0;background:#f6efe0;border:1px solid #d9ccb3;padding:8px 8px 6px;border-radius:4px;box-shadow:0 1px 0 #e6dcc8}.plate img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;border:1px solid #cdbfa6}
.plate figcaption{font-family:"Noto Serif CJK JP","Hiragino Mincho ProN",serif;font-size:12.5px;color:#4a3d30;margin-top:6px;line-height:1.55}.plate figcaption b{display:block;font-size:13.5px}.plate small{display:block;color:#8a7a66;font-size:11px;margin-top:2px}
.tl .ev .ph{font-style:normal;font-size:11px;color:#8a5a2c;margin-left:6px;white-space:nowrap}
.hy-era{border-left:4px solid var(--rail);padding:4px 0 4px 12px;margin:6px 0 10px}.hy-era h3{font-size:16px;color:var(--ink);letter-spacing:0;margin:0}.hy-era p{margin:4px 0 0;max-width:70ch}
.hmap{width:100%;min-width:640px;height:auto;display:block}.hmap text{font-size:12px;fill:var(--ink);font-family:var(--f-body);font-weight:700}.hmap .off{opacity:.18}.hmap .k{font-size:10px;fill:var(--muted);font-weight:400}
.hchart{width:100%;height:auto;display:block}.hchart text{font-size:10.5px;fill:var(--muted);font-family:var(--f-num)}.hchart .lb{font-family:var(--f-body);fill:var(--ink);font-size:11.5px}
.tl{display:grid;gap:4px;margin-top:10px}.tlr{display:grid;grid-template-columns:minmax(0,1fr) 4.2em minmax(0,1fr);gap:10px;align-items:start}.tlr .yr{grid-column:2;grid-row:1}.tlr .ev{grid-row:1}
.tl .yr{font-family:var(--f-num);text-align:center;font-weight:700;color:var(--muted);align-self:start;padding-top:6px;border-radius:6px;cursor:pointer}
.tl .ev{font:inherit;font-size:13px;text-align:left;border:1px solid var(--line2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;line-height:1.5}
.tl .ev.sister{grid-column:3;border-left:4px solid #e08a2c}.tl .ev.line{grid-column:1;border-right:4px solid var(--rail)}.tl .ev.both{grid-column:1 / span 3;border-left:4px solid #e08a2c;border-right:4px solid var(--rail);text-align:center}
.tl .ev.now{background:color-mix(in srgb,var(--rail) 12%,var(--sheet));border-color:var(--rail)}.tl .ev.past{opacity:.55}
.tl .ev i{font-style:normal;font-size:10.5px;color:var(--muted);margin-right:6px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.tl-h{display:grid;grid-template-columns:minmax(0,1fr) 4.2em minmax(0,1fr);gap:10px;font-size:12px;font-weight:700;margin-top:14px}.tl-h span:last-child{text-align:left;color:#b8661a}.tl-h span:first-child{text-align:right;color:var(--rail)}
@media (max-width:700px){.tl .by{display:none}.tlr,.tl-h{grid-template-columns:3.6em minmax(0,1fr)}.tl-h span:nth-child(2){display:none}.tl .yr{grid-column:1}.tl .ev.sister,.tl .ev.line,.tl .ev.both{grid-column:2;text-align:left}.tl-h span{text-align:left!important}}
.yk-f{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.yk-f button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:34px}
.yk-f button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}.yk-f .sep{width:1px;background:var(--line);margin:0 4px}
.yks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.yk{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sheet);display:flex;flex-direction:column}
.yk .bd{height:6px}.yk .in{padding:10px 12px 12px;display:grid;gap:6px}
.yk .cat{font-size:11px;font-weight:700;letter-spacing:.06em}.yk h4{margin:0;font-size:17px;line-height:1.3}.yk h4 small{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:6px}
.yk p{margin:0;font-size:13px}.yk .now{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line2);padding-top:6px}.yk .now b{color:var(--ink);font-weight:700;margin-right:4px}
.yk .lk{display:flex;flex-wrap:wrap;gap:6px}.yk .lk button{font:inherit;font-size:12px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer;min-height:28px}
.yk.hl{box-shadow:0 0 0 2px var(--rail)}
.ykchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ykchips button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.ykchips button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.pic{margin:14px 0 0;display:grid;gap:6px}.pic img{width:100%;max-height:560px;object-fit:cover;object-position:center 40%;border-radius:10px;border:1px solid var(--line);display:block;background:var(--line2)}
.pic figcaption{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.pic figcaption b{color:var(--ink)}.pic a{color:var(--focus)}
.yk .ph{display:block;width:100%;height:170px;object-fit:cover;object-position:center 55%;border-bottom:1px solid var(--line)}
.kk{margin-top:16px}.kk .modes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.kk .modes button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:34px}.kk .modes button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.kk .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}.kk .tile{border:1px solid var(--line2);border-radius:8px;padding:7px 10px;border-top:4px solid var(--c)}
.kk .tile dt{font-size:11.5px;color:var(--muted)}.kk .tile dd{margin:2px 0 0;font-size:19px;font-weight:700;font-family:var(--f-num)}.kk .tile dd small{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px;font-family:var(--f-body)}
.kk-in{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 12px;margin:8px 0}.kk-in label{display:grid;grid-template-columns:minmax(0,1fr) 7.5em;align-items:center;gap:6px;font-size:13px}
.kk-in input{font:inherit;font-family:var(--f-num);font-size:14px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--sheet);color:var(--ink);min-height:34px;width:100%}
.kk-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;display:grid;gap:8px}.kk-card h4{margin:0;font-size:15px}
.kk-path{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}.kk-p{border-left:4px solid var(--line);padding:2px 0 2px 10px}.kk-p b{font-size:13.5px}.kk-p p{margin:3px 0;font-size:13px}
.kk-split{display:flex;height:12px;border-radius:4px;overflow:hidden;margin:4px 0}.kk-split span{height:100%}.kk-p .lk{font:inherit;font-size:12px;border:1px solid var(--line);background:none;color:var(--focus);border-radius:6px;padding:2px 8px;cursor:pointer}
.kk .catbtns{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.kk .catbtns button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer;min-height:30px}.kk .catbtns button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.heat td.v{font-family:var(--f-num);min-width:3.4em}
.heat td.g{font-size:11px;color:var(--muted);text-align:left;padding-top:10px;font-weight:700;letter-spacing:.05em}
.heat th.sticky,.heat td.sticky{position:sticky;left:0;background:var(--sheet);z-index:1}
.note{font-size:12px;color:var(--muted);margin-top:18px;max-width:80ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <h1>みなと川沿線 街のカルテ</h1>
  <p class="lede">沿線10駅のまわり（半径約1km）にどんな施設がいくつあるか、駅がどの市町村にあり、その市町村の人口・財政・お金の流れがどうなっているかをまとめた架空の設定です。</p>

to":"O","open":1912,"elec":1953,"double":null,"gap":[1998,2000],"gapNote":"峠の鉄橋が流され、森下—温泉が運休"}],"stationOpen":{"C":1897,"S":1897,"K":1897,"N":1897,"P":1897,"U":1927,"M":1972,"F":1912,"T":1912,"O":1912},"eras":[{"from":1885,"to":1922,"name":"港と蒸気鉄道の時代","text":"外国の技師が港を設計し、城下町と港を結ぶ小さな蒸気鉄道が走り出す。1912年には温泉へ向かう鉄道もでき、湯治の客と森下の材木を運ぶ。","train":"小さな蒸気機関車と木の客車"},{"from":1923,"to":1936,"name":"電車と郊外の時代","text":"本線が電化され、中央—港は48分に。高等学校が来て、沿線に学生と勤め人の町ができる。春は桜町の城跡へ臨時電車。","train":"木造の2両の電車"},{"from":1937,"to":1949,"name":"戦争と焼け跡","text":"港は軍の工場の町になり、湯ノ谷鉄道は合併させられる。空襲で港と中央が焼け、電車の半分を失う。","train":"窓に板を打ちつけた電車"},{"from":1950,"to":1972,"name":"復興と高度成長","text":"港の埋め立て地に工場が並び、本線は複線に。丘の上にニュータウンが開かれ、朝の電車はすし詰めになる。","train":"8両の通勤電車"},{"from":1973,"to":1991,"name":"ラッシュの頂点","text":"石油危機で港の荷は減るが、通勤の人はふえ続ける。駅ビルができ、特急が走り始め、1991年に乗客が最も多くなる。","train":"冷房つきの電車と、はじめての特急"},{"from":1992,"to":2009,"name":"車と郊外モールの時代","text":"乗客が少しずつへる。大雨で峠の鉄橋が流され、温泉支線の存続が議論になる。港の古い倉庫は、姉妹港にならって生まれ変わる。","train":"ワンマンの2両の電車（支線）"},{"from":2010,"to":2026,"name":"観光と、これからの鉄道","text":"観光特急が走り、ICカードが使えるようになる。感染症で乗客が4割へるが、客船と外国からの旅行者で港と温泉に人が戻りつつある。ダイヤは、いま、あなたの手に。","train":"観光特急と、ICカード対応の通勤電車"}],"events":[{"y":1883,"side":"sister","t":"ヴェステルハーフェンの港湾技師ファン・デル・ブロークが、日本の政府に招かれて来日"},{"y":1889,"side":"line","t":"港浜村で近代港の築港が始まる。設計はファン・デル・ブローク。砂がたまらないよう川の流れを変える堤防を築く","tag":"港"},{"y":1891,"side":"sister","t":"ヴェステルハーフェンで馬が引く市電が開業"},{"y":1897,"side":"line","t":"みなと川軽便鉄道が開業。中央—港 21.5km、蒸気で75分。駅は中央・桜町・川辺・新田・港の5つ","tag":"開業"},{"y":1905,"side":"sister","t":"市電が電車になる。港には世界中の船が集まる"},{"y":1911,"side":"line","t":"峠の鉄橋が完成。谷をまたぐ赤い鉄の橋は、いまも撮影の名所","tag":"支線"},{"y":1912,"side":"line","t":"湯ノ谷鉄道が開業。川辺—温泉 12.9km。湯治の客と、森下の材木を運ぶ","tag":"支線"},{"y":1923,"side":"line","t":"本線が電化。社名を「みなと川電気鉄道」に。中央—港は48分に","tag":"電化"},{"y":1927,"side":"line","t":"高等学校が移ってきて、大学前駅（当時は「高校前」）が開業","tag":"駅"},{"y":1932,"side":"line","t":"桜町の城跡に桜を植える会ができ、春の臨時電車が走る","tag":"観光"},{"y":1940,"side":"sister","t":"戦争で国が占領され、港の荷役は止まる"},{"y":1943,"side":"line","t":"戦時の統合で、湯ノ谷鉄道を合併。港は軍需工場の町に","tag":"戦争"},{"y":1944,"side":"sister","t":"港の岸壁とクレーンが爆破され、港は壊滅"},{"y":1945,"side":"line","t":"空襲で港と中央が焼ける。電車の半分を失い、港の人口は4割へる","tag":"戦争"},{"y":1949,"side":"line","t":"高等学校が国立みなと川大学になり、「高校前」を「大学前」に改名","tag":"駅"},{"y":1953,"side":"line","t":"温泉支線が電化。蒸気機関車が沿線から消える","tag":"電化"},{"y":1955,"side":"sister","t":"港の復興が終わり、ヨーロッパでいちばん忙しい港のひとつになる"},{"y":1958,"side":"line","t":"港浜の海を埋め立てて臨海工業地帯をつくり始める。のちの化学工場・製鋼所が並ぶ","tag":"港"},{"y":1961,"side":"line","t":"本線が複線になり、快速の運転が始まる。中央—港は31分","tag":"複線"},{"y":1965,"side":"both","t":"港浜市とヴェステルハーフェンが姉妹港になる。80年前の技師の縁から"},{"y":1966,"side":"sister","t":"河口の外にコンテナ埠頭ができる。旧港の荷役の仕事が急にへり、倉庫街がさびれていく"},{"y":1968,"side":"line","t":"社名を「みなと川電鉄」に","tag":"会社"},{"y":1971,"side":"sister","t":"車がふえ、市電の路線の半分が廃止される"},{"y":1972,"side":"line","t":"緑ヶ丘ニュータウンの入居が始まり、緑ヶ丘駅が開業。朝の電車が8両に","tag":"駅"},{"y":1973,"side":"line","t":"石油危機。港の荷が減り、港浜市の人口がはじめて減る","tag":"港"},{"y":1974,"side":"both","t":"ヴェステルハーフェンから、廃止された市電の古い電車1両が贈られる（いまは海洋博物館に）"},{"y":1979,"side":"line","t":"中央駅ビルが完成。駅ビル百貨店が開く","tag":"駅"},{"y":1984,"side":"line","t":"港の貨物線を廃止。荷物はトラックへ","tag":"港"},{"y":1987,"side":"sister","t":"さびれた倉庫街を、住宅とミュージアムとレストランに生まれ変わらせる計画が始まる"},{"y":1988,"side":"line","t":"特急の運転が始まる。中央—港は19分","tag":"特急"},{"y":1991,"side":"line","t":"乗客が最も多くなる（1日15.2万人）。朝の中央駅は改札の外まで列","tag":"ラッシュ"},{"y":1995,"side":"sister","t":"市電を新しい低い床の電車で延ばし、自転車のまま乗れる電車も走らせる"},{"y":1998,"side":"line","t":"大雨で峠の鉄橋が流される。森下—温泉が運休し、支線をやめる話が出る","tag":"支線"},{"y":1999,"side":"both","t":"港浜の赤レンガ倉庫を、ヴェステルハーフェンの倉庫街にならって再生。川辺には大型モールが開く"},{"y":2000,"side":"line","t":"沿線の募金と県の補助で鉄橋を架け直し、温泉支線が全線で再開","tag":"支線"},{"y":2005,"side":"line","t":"市町村合併の話。緑野市は隣の村と合併したが、森下村と湯ノ谷町は合併しないと決める","tag":"街"},{"y":2009,"side":"line","t":"温泉支線の沿線協議会ができる。村と町が駅と線路の手入れの費用を一部受け持つ","tag":"支線"},{"y":2010,"side":"sister","t":"旧港に客船ターミナルが開く"},{"y":2011,"side":"line","t":"観光特急がデビュー。峠の鉄橋で一時停車し、車内で地元の弁当を売る","tag":"観光"},{"y":2013,"side":"line","t":"ICカードが使えるようになる","tag":"会社"},{"y":2014,"side":"both","t":"電鉄の若手社員がヴェステルハーフェンへ。自転車を持ちこめる電車を学び、週末の支線で試す"},{"y":2018,"side":"line","t":"港浜に客船ターミナル。大きな客船が寄る日は港駅があふれる","tag":"港"},{"y":2020,"side":"line","t":"感染症で乗客が4割へる。観光特急は半年運休","tag":"会社"},{"y":2022,"side":"sister","t":"港の船と工場の二酸化炭素をなくす計画を発表"},{"y":2024,"side":"line","t":"客船と外国からの旅行者が戻り、温泉の宿泊がふえる","tag":"観光"},{"y":2026,"side":"line","t":"いま。ダイヤ工房で、あなたがダイヤを組む","tag":"いま"}],"plates":[{"y":1889,"src":"img/h1889-chikko.jpg","t":"港浜の築港","c":"石を積んで川の流れを変える堤防を築く。手前で図面を広げているのが、ヴェステルハーフェンから来た技師。"},{"y":1897,"src":"img/h1897-kaigyo.jpg","t":"みなと川軽便鉄道の開業","c":"小さな蒸気機関車と木の客車。開業の日、駅には紅白の幕が張られ、町の人が見物に集まった。"},{"y":1923,"src":"img/h1923-denka.jpg","t":"本線の電化","c":"架線の下を走る木造の電車。石垣の川沿いを、城下町の家並みをぬって走る。"},{"y":1945,"src":"img/h1945-yakeato.jpg","t":"空襲のあとの港と駅","c":"焼けた駅の屋根と電車。がれきの中で、線路を直す人たち。"},{"y":1972,"src":"img/h1972-newtown.jpg","t":"ニュータウンと通勤ラッシュ","c":"丘の上に団地が建ち並び、朝の駅には勤めに出る人の列ができた。"},{"y":2011,"src":"img/h2020-renga.jpg","t":"生まれ変わった港と観光の鉄道","c":"倉庫街はカフェと散歩道に。観光の電車が赤い鉄橋を渡る（絵では港の前にあるが、実際の鉄橋は峠の谷にかかる）。"}],"platesNote":"挿絵はAIで描いた架空のイメージ（歴史の教科書の挿絵風）。","platesFull":"img/history-plates.jpg"},"yukari":{"cats":{"build":"歴史建造物","town":"街並み","food":"名産品","person":"人物"},"items":[{"cat":"build","name":"旧港浜築港事務所","st":"P","y":1891,"text":"港の工事を指揮した2階建ての洋館。白い板張りの壁と、北の国の家のような急な屋根。2階の製図室には、ファン・デル・ブロークが描いた堤防の設計図が、いまも額に入って残る。","now":"港浜市の「港のはじまり資料室」。毎年5月の築港記念日に、設計図の原本が一日だけ公開される。","catName":"歴史建造物"},{"cat":"build","name":"港浜赤レンガ倉庫","st":"P","y":1908,"text":"輸入した綿花と砂糖を入れた倉庫群。戦争で1棟が焼け、コンテナの時代に空き家になった。1999年、姉妹港の倉庫街にならって、市場とレストランとホールに生まれ変わる。","now":"週末はマルシェと音楽。いちばん奥の棟には、焼けた壁のすすがわざと残してある。","catName":"歴史建造物"},{"cat":"build","name":"峠の鉄橋","st":"T","y":1911,"text":"谷を渡る長さ142mの赤いトラス橋。1998年の大雨で中央の2径間が流され、2000年に架け直された。流されずに残った最初の鉄の桁が、橋のたもとに置かれている。","now":"観光特急が橋の上で一時停車する。撮影の名所で、秋の紅葉の朝は三脚が並ぶ。","catName":"歴史建造物"},{"cat":"build","name":"元湯の木造湯屋","st":"O","y":1915,"text":"湯ノ谷鉄道の開業で湯治の客がふえ、町の人がお金を出し合って建て直した共同浴場。唐破風の玄関と、天井の高い湯殿。","now":"入浴料は町の人と同じ。朝6時の一番湯に、鉄道の運転士が寄るのが昔からの習わし。","catName":"歴史建造物"},{"cat":"build","name":"中央駅の「赤屋根」","st":"C","y":1923,"text":"電化に合わせて建てた2代目の駅舎。赤い瓦の大屋根と、正面の丸い時計。1979年に駅ビルを建てたとき、市民の声で正面の壁と時計だけを残した。","now":"駅ビルの北口の顔。時計は毎日、正午に一度だけ鳴る。","catName":"歴史建造物"},{"cat":"build","name":"旧川辺変電所","st":"K","y":1923,"text":"電車に電気を送るために建てたレンガの変電所。1961年の複線化で役目を終え、長く物置になっていた。","now":"河川敷公園のカフェ。窓の大きなアーチと、天井に残るクレーンの線路が目印。","catName":"歴史建造物"},{"cat":"build","name":"高校の時計台","st":"U","y":1927,"text":"移ってきた高等学校の本館。駅名がしばらく「高校前」だったのはこの建物のため。空襲の夜、学生たちが屋根の火を消して守った。","now":"国立みなと川大学の大学博物館。時計台の上の展望室は、入学式の日だけ開く。","catName":"歴史建造物"},{"cat":"build","name":"緑ヶ丘の給水塔","st":"M","y":1971,"text":"ニュータウンの全部の家に水を送るため、丘のいちばん上に建てたコンクリートの塔。上が広がったワイングラスのような形は、団地の子どもたちに「きのこ」と呼ばれた。","now":"もう水は送っていないが、町のしるしとして残す。夜は季節ごとに色が変わる。","catName":"歴史建造物"},{"cat":"town","name":"寺町通りの石畳","st":"S","y":1650,"text":"城下町のころから続く、お寺が9つ並ぶ通り。白い土塀と石畳。鉄道が通ったとき、通りを切らないように線路を少し南へ曲げた。","now":"春は城跡の桜と合わせて歩く人が多い。桜町駅のカーブは、そのときの名残。","catName":"街並み"},{"cat":"town","name":"港浜の海岸通り","st":"P","y":1900,"text":"築港のあとにできた、洋館と商館が並ぶ通り。窓枠を白、扉を緑に塗るのは、ファン・デル・ブロークの故郷の港をまねたものと言われる。","now":"姉妹港から贈られた古い市電の電車が、通りの端の海洋博物館の前に置かれている。","catName":"街並み"},{"cat":"town","name":"湯けむり坂","st":"O","y":1930,"text":"温泉駅から元湯まで、木造三階建ての旅館が並ぶ石段の坂。鉄道で団体客が来た昭和の半ばに、いまの姿になった。","now":"旅館は28軒。夕方には坂の途中の湯気抜きから湯けむりが上がる。","catName":"街並み"},{"cat":"town","name":"北門通り","st":"U","y":1950,"text":"新しい大学ができ、北門の前に下宿と古本屋と安い食堂が並んだ学生街。","now":"古本屋は5軒に減ったが、夜遅くまで明るい。終電を逃した学生が始発まで粘る店もある。","catName":"街並み"},{"cat":"town","name":"緑ヶ丘のけやき並木","st":"M","y":1972,"text":"ニュータウンの入居と一緒に植えた、駅から団地まで1.2kmのけやき並木。最初の入居者の子どもたちが1本ずつ名札を付けた。","now":"木は4階の屋上より高くなった。名札を探しに、大人になった子どもが帰ってくる。","catName":"街並み"},{"cat":"town","name":"新田の棚田と石の水路","st":"N","y":1895,"text":"ファン・デル・ブロークの弟子が、港の堤防の技術を使って直した用水路。山の水を棚田に分ける石の分水口が今も働いている。","now":"田植えのころ、水を張った棚田に電車が映る。沿線の写真コンテストの常連の場所。","catName":"街並み"},{"cat":"food","name":"蒸気まんじゅう","st":"S","y":1897,"text":"軽便鉄道の開業の日に、桜町の菓子屋が売り出した酒まんじゅう。汽車の煙に見立てて、ふかしたてを湯気ごと売った。","now":"同じ店の4代目が作る。駅の売店では午前中に売り切れる日が多い。","catName":"名産品"},{"cat":"food","name":"森下杉の曲げわっぱ","st":"F","y":1912,"text":"湯ノ谷鉄道が森下の杉を運ぶようになって、村の外にも売れるようになった弁当箱。木目のまっすぐな森下の杉は、曲げても割れにくい。","now":"観光特急の車内で売る弁当は、この曲げわっぱ入り。空き箱を持ち帰る人が多い。","catName":"名産品"},{"cat":"food","name":"湯ノ谷の湯の花と温泉たまご","st":"O","y":1915,"text":"源泉にたまる白い湯の花を乾かした入浴の素と、源泉でゆでる温泉たまご。どちらも湯治の客のおみやげから始まった。","now":"温泉駅の改札の前で、ゆでたての温泉たまごを売る。","catName":"名産品"},{"cat":"food","name":"鉄橋だんご","st":"T","y":1932,"text":"峠の茶屋が、鉄橋を撮りに来る写真家のために出した、赤い醤油だれのだんご。串の形を鉄橋に見立てて、だんごを4つ斜めに刺す。","now":"鉄橋が流された年も、茶屋は店を閉めなかった。再開の日に配っただんごは3千本。","catName":"名産品"},{"cat":"food","name":"港浜の鯖のへしこ","st":"P","y":1960,"text":"魚市場に揚がる鯖を、ぬかに漬けて1年寝かせた保存食。工場の夜勤明けの朝ごはんとして広まった。","now":"港浜フーズと市場の店が作る。薄く切ってあぶると、酒によく合う。","catName":"名産品"},{"cat":"food","name":"ブローク・ワッフル","st":"P","y":1965,"text":"姉妹港になった年、ヴェステルハーフェンから来た使節団が教えた、薄い2枚のワッフルに蜜をはさむ焼き菓子。技師ファン・デル・ブロークの名前をとった。","now":"赤レンガ倉庫の名物。客船が寄る日は行列。","catName":"名産品"},{"cat":"food","name":"にったの雫","st":"N","y":1990,"text":"石の水路の水で育てた棚田米。農協と若い農家が名前を付けて売り出した。","now":"直売所では精米したてを量り売り。売店のおにぎりの米もこれにすると、少し高いがよく売れる…かもしれない。","catName":"名産品"},{"cat":"food","name":"北門カレー","st":"U","y":1955,"text":"大学の北門前の食堂が、仕送り前の学生のために出した、具の少ない黄色いカレー。量だけは多い。","now":"卒業生が帰ってくると必ず食べる。レトルトは中央駅の駅ビルでも買える。","catName":"名産品"},{"cat":"person","name":"ファン・デル・ブローク","kana":"港の技師","st":"P","y":1889,"life":"1851–1924","text":"ヴェステルハーフェン生まれの港湾技師。日本の政府に招かれ、砂で浅くなる河口に、川の流れを変える堤防を築いて港浜の港をつくった。新田の用水路も弟子と直した。","now":"港の公園に立つ銅像は、海ではなく堤防の方を向いている。姉妹港の縁は、この人から始まった。","catName":"人物"},{"cat":"person","name":"桜木 源三郎","kana":"鉄道の創業者","st":"S","y":1897,"life":"1848–1919","text":"桜町の材木問屋。港の材木を城下町へ運ぶため、町の商人を説いてまわり、みなと川軽便鉄道をつくった。「線路は寺町を切るな」と言って、カーブを入れさせた人。","now":"桜町駅のホームに、創業の日の写真と小さな記念碑がある。","catName":"人物"},{"cat":"person","name":"湯川 しづ","kana":"温泉の女将","st":"O","y":1912,"life":"1866–1941","text":"湯ノ谷の旅館の女将。湯治の客を増やそうと、旅館どうしでお金を集めて湯ノ谷鉄道を走らせた。元湯の建て直しでも先頭に立った。","now":"温泉資料館に、しづが書いた「鉄道の客を迎える心得」が飾られている。","catName":"人物"},{"cat":"person","name":"霧野 朔","kana":"写真家","st":"T","y":1932,"life":"1904–1987","text":"峠の鉄橋を撮り続けた写真家。写真集『峠の赤い橋』で、鉄橋と峠の名を全国に知らせた。鉄橋だんごは、霧野のために茶屋が考えたもの。","now":"峠の自然館に、霧野の暗室と三脚が残る。","catName":"人物"},{"cat":"person","name":"葛城 光子","kana":"建築家","st":"M","y":1972,"life":"1931–2016","text":"緑ヶ丘ニュータウンを設計した建築家。「子どもが駅まで車道を渡らずに歩ける町」を目指し、けやき並木の歩道と給水塔をデザインした。","now":"ニュータウンセンターの広場に、葛城の言葉を刻んだベンチがある。","catName":"人物"},{"cat":"person","name":"鳴海 正吉","kana":"笛の駅長","st":"C","y":1991,"life":"1936–2019","text":"ラッシュがいちばんすごかった頃の中央駅長。ホームに立って、笛ひとつで乗る人と降りる人の流れを整えた。「押さない、急がない、次も来る」が口ぐせ。","now":"駅ビルの赤屋根の時計の下に、鳴海の笛が展示されている。","catName":"人物"},{"cat":"person","name":"灯 あかね","kana":"漫画家","st":"K","y":1998,"life":"1972–","text":"川辺生まれの漫画家。鉄橋が流された年、峠の茶屋の娘を主人公にした漫画『峠のふたり』を描き、印税を鉄橋の募金に寄付した。募金が全国から集まるきっかけになった。","now":"川辺の旧変電所カフェに、原画のコーナーがある。","catName":"人物"},{"cat":"person","name":"ルート・ファン・デル・ブローク","kana":"技師のひ孫","st":"P","y":2014,"life":"1979–","text":"ヴェステルハーフェンの市電の運転士。電鉄の若手社員が見学に来たとき、自転車を電車に積む仕方を教えた。","now":"毎年5月の築港記念日には、港浜に来て、ひいおじいさんの設計図の前で話をする。","catName":"人物"}]},"images":{"yunotani":{"src":"img/yunotani-slope.jpg","full":"img/yunotani-magazine.jpg","alt":"秋の夕暮れ、提灯の灯る木造の旅館に挟まれた石段の坂と、坂の上の湯屋。湯けむりが立ちのぼる。","caption":"湯けむり坂と元湯（イメージ）","note":"AIで描いた架空の湯ノ谷温泉のイメージ（雑誌のページ風）。左ページの本文と路線図の駅名は飾りの文字で、設定とは関係ありません。","st":"O","yk":["湯けむり坂","元湯の木造湯屋"],"pos":{"元湯の木造湯屋":"center 36%","湯けむり坂":"center 75%"}},"toge":{"src":"img/toge-bridge.jpg","full":"img/toge-magazine.jpg","alt":"秋の朝、霧の谷にかかる赤い鉄橋をクリーム色と赤の電車が渡る。奥に滝、手前に茶屋と三脚を立てる写真家。","caption":"峠の鉄橋（イメージ）","note":"AIで描いた架空の峠の鉄橋のイメージ（雑誌のページ風）。左ページの本文と路線図の文字は飾りで、設定とは関係ありません。","st":"T","yk":["峠の鉄橋","鉄橋だんご","霧野 朔"],"pos":{"峠の鉄橋":"15% 40%","鉄橋だんご":"10% 82%","霧野 朔":"30% 88%"}},"renga":{"src":"img/renga.jpg","full":"img/renga-magazine.jpg","alt":"夕暮れのあとの港。すすの残る赤レンガ倉庫の前の広場にマルシェのテントと電球、展示された緑の古い路面電車、奥に白い客船と洋館。","caption":"港浜赤レンガ倉庫（イメージ）","note":"AIで描いた架空の港浜赤レンガ倉庫のイメージ（雑誌のページ風）。左ページの本文と路線図の文字は飾りで、設定とは関係ありません。","st":"P","yk":["港浜赤レンガ倉庫","港浜の海岸通り"],"pos":{"港浜赤レンガ倉庫":"30% 45%","港浜の海岸通り":"95% 27%"}},"meisan":{"src":"img/meisan.jpg","full":"img/meisan-magazine.jpg","alt":"木の机に並ぶ沿線の名物。蜜をはさんだ薄いワッフル、あぶった鯖のへしこ、米袋とおにぎり、黄色いカレー。","caption":"沿線の味（イメージ）","note":"AIで描いた架空の名産品のイメージ（雑誌のページ風）。左ページの本文と路線図の文字は飾りで、設定とは関係ありません。","y /* ---- お金の流れ（払う側→受け取る側のサンキー図） ---- */
const KC={'給料（通勤）':'#2f5d8a','買い物・飲食':'#c98a54','観光の消費':'#a5533f','港と物流':'#2f8a86','交付税・補助金':'#7d6a9a','運賃':'#c23b3b','給料（電鉄の社員）':'#5d8ac2','税金（固定資産税など）':'#8c96a1'};
function money(){const kinds=Object.keys(KC);if(!cur.kinds)cur.kinds=new Set(kinds);
  const F=DATA.flows.filter(f=>cur.kinds.has(f.kind));
  const L=[...new Set(F.map(f=>f.src))],R=[...new Set(F.map(f=>f.dst))];
  const sum=(arr,key,n)=>arr.filter(f=>f[key]===n).reduce((a,f)=>a+f.v,0);
  const W=900,gap=8,x0=230,x1=W-230,nw=12;
  const tl=L.reduce((a,n)=>a+sum(F,'src',n),0),tr=R.reduce((a,n)=>a+sum(F,'dst',n),0);
  const sc=560/Math.max(tl,tr,1);   // 小さい流れも名前が重ならないよう、名前の高さぶんの場所は必ずとる
  const place=(names,key)=>{let y=10;const o={};names.sort((a,b)=>sum(F,key,b)-sum(F,key,a)).forEach(n=>{const h=Math.max(2,sum(F,key,n)*sc);o[n]={y,h,off:0};y+=Math.max(h,30)+gap;});o._end=y;return o;};
  const NL=place(L,'src'),NR=place(R,'dst');const H=Math.max(NL._end,NR._end)+6;delete NL._end;delete NR._end;const g=[];
  F.slice().sort((a,b)=>b.v-a.v).forEach((f,i)=>{const h=Math.max(1,f.v*sc),a=NL[f.src],b=NR[f.dst],ya=a.y+a.off,yb=b.y+b.off;a.off+=h;b.off+=h;const xm=(x0+nw+x1)/2;
    g.push(`<path data-s="${esc(f.src)}" data-d="${esc(f.dst)}" fill="${KC[f.kind]}" d="M${x0+nw},${ya} C${xm},${ya} ${xm},${yb} ${x1},${yb} L${x1},${yb+h} C${xm},${yb+h} ${xm},${ya+h} ${x0+nw},${ya+h}Z"><title>${esc(f.src)} → ${esc(f.dst)}：${esc(f.kind)} ${fmt(f.v,f.v<10?1:0)}億円/年</title></path>`);});
  for(const [n,o] of Object.entries(NL))g.push(`<rect data-n="${esc(n)}" x="${x0}" y="${o.y}" width="${nw}" height="${o.h}" fill="var(--ink)"/><text x="${x0-8}" y="${o.y+Math.max(o.h,30)/2-6}" text-anchor="end" dominant-baseline="middle">${esc(n)}</text><text class="v" x="${x0-8}" y="${o.y+Math.max(o.h,30)/2+8}" text-anchor="end" dominant-baseline="middle">${fmt(sum(F,'src',n))}億円</text>`);
  for(const [n,o] of Object.entries(NR))g.push(`<rect data-n="${esc(n)}" x="${x1}" y="${o.y}" width="${nw}" height="${o.h}" fill="var(--ink)"/><text x="${x1+nw+8}" y="${o.y+Math.max(o.h,30)/2-6}" dominant-baseline="middle">${esc(n)}</text><text class="v" x="${x1+nw+8}" y="${o.y+Math.max(o.h,30)/2+8}" dominant-baseline="middle">${fmt(sum(F,'dst',n))}億円</text>`);
  const list=F.slice().sort((a,b)=>b.v-a.v).map(f=>`<tr><td>${esc(f.src)}</td><td>→ ${esc(f.dst)}</td><td style="text-align:left"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${KC[f.kind]};margin-right:5px"></i>${esc(f.kind)}</td><td class="num">${fmt(f.v,f.v<10?1:0)}</td></tr>`).join('');
  $('#v-money').innerHTML=`<div class="sheet" style="margin-top:16px"><h2>だれが、だれに、お金を払っているか（1年・億円）</h2>
    <p class="hint">左が払う側、右が受け取る側。帯の太さが金額。帯や名前にふれると、その流れが強調されます。${esc(DATA.rail.note)}</p>
    <button type="button" class="jump" id="toPort">いちばん太い流れ「沿線の外の荷主」の中身を見る ↓</button>
    <div class="kinds">${kinds.map(k=>`<button data-k="${esc(k)}" aria-pressed="${cur.kinds.has(k)}"><i style="background:${KC[k]}"></i>${esc(k)}</button>`).join('')}</div>
    <div class="scroll"><svg class="sankey" viewBox="0 0 ${W} ${H}" role="img" aria-label="お金の流れの図">${g.join('')}</svg></div>
    <h3 style="margin-top:14px">流れの一覧</h3><div class="scroll"><table><thead><tr><th>払う側</th><th>受け取る側</th><th style="text-align:left">種類</th><th>億円/年</th></tr></thead><tbody>${list}</tbody></table></div>
    <p class="hint">みなと川電鉄の運賃収入 <span class="num">${fmt(DATA.rail.fareTotal,1)}</span>億円/年（平均運賃${DATA.rail.avgFare}円）・社員${fmt(DATA.rail.staff)}人</p></div>`;
  const svg=$('#v-money svg');const hl=n=>svg.querySelectorAll('path').forEach(p=>{const on=!n||p.dataset.s===n||p.dataset.d===n;p.classList.toggle('dim',!on);p.classList.toggle('hi',!!n&&on);});
  svg.addEventListener('mouseover',e=>{const p=e.target.closest('path,rect');if(!p)return;if(p.tagName==='rect')hl(p.dataset.n);else{svg.querySelectorAll('path').forEach(q=>{q.classList.toggle('dim',q!==p);q.classList.toggle('hi',q===p);});}});
  svg.addEventListener('mouseleave',()=>hl(null));svg.addEventListener('click',e=>{const r=e.target.closest('rect');hl(r?r.dataset.n:null);});
  $('#v-money').querySelectorAll('.kinds button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;if(cur.kinds.has(k)){if(cur.kinds.size>1)cur.kinds.delete(k);}else cur.kinds.add(k);money();}));
  const pb=document.createElement('section');pb.className='sheet port';pb.id='port';$('#v-money').appendChild(pb);port();
  const kb=document.createElement('section');kb.className='sheet kk';kb.id='kakei';$('#v-money').prepend(kb);kakei();
  $('#toPort').addEventListener('click',()=>pb.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}));
  svg.addEventListener('dblclick',e=>{const r=e.target.closest('rect');if(r&&r.dataset.n==='沿線の外の荷主')$('#toPort').click();});}

/* ---- ひとりの家計から見るお金の流れ：費目 → 払った先（沿線の店・役所）→ 最後にどこへ。自分の家計も入れられる（このブラウザの中だけ） ---- */
const KK_KEY='karte-kakei-m',KK_OLD='karte-kakei';
function kkMine(){try{let o=JSON.parse(localStorage.getItem(KK_KEY)||'null');if(!o){const y=JSON.parse(localStorage.getItem(KK_OLD)||'null');if(y){o={};for(const k in y)o[k]=Math.round(y[k]/12);localStorage.setItem(KK_KEY,JSON.stringify(o));localStorage.removeItem(KK_OLD);}}return o;}catch(e){return null;}}

/* 売店の店員：ゲームの保存データ（同じサイトのブラウザ保存 dia-kiosk）から、店員の顔ぶれと実際の稼ぎを読む */
let KCFG=null;fetch('../data/kiosk.json').then(r=>r.ok?r.json():null).then(j=>{KCFG=j;if(cur.view==='money'&&cur.kk&&cur.kk.mode==='clerk')kakei();}).catch(()=>{});
function kkKiosk(){try{return JSON.parse(localStorage.getItem('dia-kiosk')||'null');}catch(e){return null;}}
function clerkInfo(id){const KS=kkKiosk(),CL=DATA.kakei.clerk,B=KCFG&&KCFG.crew?KCFG.crew:null;
  const blocks=B?B.blocks:[{id:'m',from:6,to:10},{id:'d',from:10,to:14},{id:'e',from:14,to:18},{id:'n',from:18,to:23}],wd=B?B.weekDays:{wd:5,sat:1,hol:1},kinds=B?B.kinds:[{id:'free',name:'フリーター'},{id:'stu',name:'学生'},{id:'home',name:'主婦・主夫'},{id:'sen',name:'シニア'}];
  const people=KS&&KS.crew?KS.crew.people.filter(p=>p.leave==null):[];
  const p=people.find(x=>x.id===id)||people[0]||null;
  if(!p){const S=CL.sample;return {people,p:null,name:S.name,kind:S.kind,kindName:(kinds.find(k=>k.id===S.kind)||{}).name,wage:S.wage,week:S.week,year:S.wage*S.week*52,src:'例の数字',kinds};}
  let week=0;for(const t in wd)for(const b of ((KS.crew.shift[t]||{})[p.id]||[])){const x=blocks.find(y=>y.id===b);if(x)week+=(x.to-x.from)*wd[t];}
  const H=(KS.hist||[]).slice(-30),days=H.filter(h=>h.crew).length,earned=H.reduce((a,h)=>a+((h.crew||[]).find(c=>c[0]===p.id)||[0,0])[1],0);
  const year=days>=14?earned/days*365:p.wage*week*52;   // 2週間分たまるまでは、時給×シフトの時間×52週
  const sales=days?H.filter(h=>h.crew).reduce((a,h)=>a+h.sales,0)/days:null,cust=days?H.filter(h=>h.crew).reduce((a,h)=>a+h.cust,0)/days:null,staff=days?H.filter(h=>h.crew).reduce((a,h)=>a+(h.staff||0),0)/days:null;
  const so=KCFG&&KCFG.move&&KCFG.move.social?KCFG.move.social.employee:0.15,take=p.insured?year*(1-so):year;
  return {people,p,insured:!!p.insured,commute:p.commute||0,so,take,name:p.name+'さん',kind:p.kind,kindName:(kinds.find(k=>k.id===p.kind)||{}).name,wage:p.wage,week,year,src:days>=14?`ゲームの直近${days}日の実際の稼ぎから`:'時給×週の時間×52週',sales,cust,staff,mine:days?earned/days:null,kinds};}
function clerkHead(CI){const KD=DATA.kakei,CL=KD.clerk,y=v=>Math.round(v).toLocaleString('ja-JP')+'円';
  const sel=CI.people.length?`<label class="hint">店員 <select id="kkClerk" style="font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink)">${CI.people.map(p=>`<option value="${p.id}" ${CI.p&&p.id===CI.p.id?'selected':''}>${esc(p.name)}さん</option>`).join('')}</select></label>`:'<p class="hint">ゲームでまだ売店を出していないので、例の店員で見ています。売店を出すと、あなたの店の店員で見られます。</p>';
  const spent=Object.values(CL.plan[CI.kind]||{}).reduce((a,b)=>a+b,0);
  const chain=CI.sales?`<div class="kk-card"><h4>この人の稼ぎは、どこから来たか</h4><p style="margin:0;font-size:13px;line-height:1.9">
      駅の売店に、1日 <b>${Math.round(CI.cust)}人</b> のお客さんが来て <b>${y(CI.sales)}</b> を払う（通勤の人・学生・観光客…）<br>

      → 1か月でおよそ <b>${y(CI.year/12)}</b>${CI.insured?`（社会保険を引いた手取りは <b>${y(CI.take/12)}</b>）`:''}。それを、下の図のように沿線で使う</p><p class="hint" style="margin:0">1日の数字は、ゲームの直近の運行日の平均です。1年の稼ぎは、2週間分の記録がたまるまでは時給×週の時間×52週、たまったら実際の稼ぎから出します。</p></div>`:'';
  return `<p class="hint" style="max-width:72ch">${esc(CL.lede)}</p>${sel}
    <dl class="tiles"><div class="tile" style="--c:#2f8a4a"><dt>${esc(CI.name)}（${esc(CI.kindName||'')}）</dt><dd>${y(CI.wage)}<small>時給・週${CI.week}時間</small></dd></div>
      <div class="tile" style="--c:#2f8a4a"><dt>1か月の稼ぎ</dt><dd>${y(CI.year/12)}<small>${esc(CI.src)}・1年で${y(CI.year)}${CI.insured?`・社会保険に入っていて、給料から約${Math.round(CI.so*100)}%引かれる（手取り月${y(CI.take/12)}。かわりに厚生年金と健康保険）`:''}${CI.commute?`・交通費は別に1日${y(CI.commute)}（往復の運賃に消える）`:''}</small></dd></div>

  const keyOf=el=>el.dataset.o?['o',el.dataset.o]:el.dataset.c&&el.tagName==='rect'?['c',el.dataset.c]:el.dataset.d&&el.tagName==='rect'?['d',el.dataset.d]:null;
  svg.addEventListener('mouseover',e=>{const el=e.target.closest('path,rect');if(!el)return;if(el.tagName==='path'){svg.querySelectorAll('path').forEach(q=>{q.classList.toggle('dim',q!==el);q.classList.toggle('hi',q===el);});return;}const kv=keyOf(el);if(kv)hl(...kv);});
  svg.addEventListener('mouseleave',()=>cur.co?hl('c',cur.co):hl(null));
  svg.addEventListener('click',e=>{const el=e.target.closest('rect');const kv=el&&keyOf(el);if(kv)hl(...kv);else hl(null);});
  if(cur.co)hl('c',cur.co);
  box.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.w;cur.wi.has(k)?cur.wi.delete(k):cur.wi.add(k);port();}));
  box.querySelectorAll('[data-co]').forEach(b=>b.addEventListener('click',()=>{cur.co=cur.co===b.dataset.co?null:b.dataset.co;port();}));}

/* ---- 歴史：年を動かすと、路線・人口・乗客が、その年の姿になる。姉妹港の歴史と並べて読む ---- */
function history(){const Hs=DATA.history;if(cur.year==null)cur.year=2026;const y=cur.year,Y=Hs.seriesYears;
  const lin=(arr,yr)=>{if(yr<=Y[0])return arr[0];for(let i=1;i<Y.length;i++)if(yr<=Y[i]){const a=arr[i-1],b=arr[i];if(a==null||b==null)return b??a;return a+(b-a)*(yr-Y[i-1])/(Y[i]-Y[i-1]);}return arr[arr.length-1];};
  const era=Hs.eras.find(e=>y>=e.from&&y<=e.to)||Hs.eras[0];
  const popT=Object.values(Hs.pop).reduce((a,arr)=>a+lin(arr,y),0),rid=Hs.riders,ride=y<1897?0:lin(rid,y);
  const fast=y<1897?null:Hs.fastest[Math.max(0,Y.findIndex((v,i)=>v<=y&&(i===Y.length-1||Y[i+1]>y)))];
  // 路線図（その年の姿）
  const g=[],sec=Hs.sections;
  const styleOf=x=>{if(y<x.open)return null;const gap=x.gap&&y>=x.gap[0]&&y<x.gap[1];return {w:x.double&&y>=x.double?7:3.5,dash:y<x.elec?'7 6':'',gap};};
  const mainS=styleOf(sec[0]),brS=styleOf(sec[1]);
  g.push(`<path d="M${POS.C[0]} 180 L${POS.P[0]} 180" stroke="var(--line)" stroke-width="3" fill="none"/><path d="M${POS.K[0]} 180 L${POS.F[0]} ${POS.F[1]} L${POS.T[0]} ${POS.T[1]} L${POS.O[0]} ${POS.O[1]}" stroke="var(--line)" stroke-width="3" fill="none"/>`);
  if(mainS)g.push(`<path d="M${POS.C[0]} 180 L${POS.P[0]} 180" stroke="var(--rail)" stroke-width="${mainS.w}" stroke-dasharray="${mainS.dash}" fill="none"/>`);
  if(brS){g.push(`<path d="M${POS.K[0]} 180 L${POS.F[0]} ${POS.F[1]}" stroke="var(--rail)" stroke-width="${brS.w}" stroke-dasharray="${brS.dash}" fill="none"/>`);
    g.push(`<path d="M${POS.F[0]} ${POS.F[1]} L${POS.T[0]} ${POS.T[1]} L${POS.O[0]} ${POS.O[1]}" stroke="${brS.gap?'#c9573f':'var(--rail)'}" stroke-width="${brS.w}" stroke-dasharray="${brS.gap?'2 6':brS.dash}" fill="none" stroke-linejoin="round"/>`);
    if(brS.gap)g.push(`<text x="${(POS.T[0]+POS.O[0])/2+8}" y="${(POS.T[1]+POS.O[1])/2+28}" style="fill:#c9573f">運休中（鉄橋の流失）</text>`);}
  for(const k of ORD){const [x,yy]=POS[k],op=Hs.stationOpen[k]<=y,nm=k==='U'&&y<1949?'高校前':S[k].name,up=yy<180;
    g.push(`<g class="${op?'':'off'}"><circle cx="${x}" cy="${yy}" r="7" fill="${op?'var(--sheet)':'var(--line2)'}" stroke="var(--ink)" stroke-width="2.5"/><text x="${x}" y="${up?yy-14:yy+26}" text-anchor="middle">${nm}</text>${op?'':`<text class="k" x="${x}" y="${up?yy-28:yy+40}" text-anchor="middle">${Hs.stationOpen[k]}年〜</text>`}</g>`);}
  g.push(`<text class="k" x="20" y="232">太線＝複線　細線＝単線　点線＝電化前（蒸気）</text>`);
  // グラフ：1日の乗客（千人）と、市町村ごとの人口（千人・積み上げ）
  const CW=440,CH=190,l=40,r=10,t=14,b=26,X=v=>l+(v-1890)/(2026-1890)*(CW-l-r);
  const ax=(mx,step,f)=>{const o=[];for(let v=0;v<=mx;v+=step){const yy2=t+(1-v/mx)*(CH-t-b);o.push(`<line x1="${l}" x2="${CW-r}" y1="${yy2}" y2="${yy2}" stroke="var(--line2)"/><text x="${l-5}" y="${yy2+3}" text-anchor="end">${f(v)}</text>`);}for(const yr of [1900,1950,2000])o.push(`<text x="${X(yr)}" y="${CH-8}" text-anchor="middle">${yr}</text>`);return o.join('');};
  const mk=`<line x1="${X(y)}" x2="${X(y)}" y1="${t}" y2="${CH-b}" stroke="var(--rail)" stroke-width="2"/>`;
  const RM=160,ry=v=>t+(1-v/RM)*(CH-t-b);const rp=Y.map((yr,i)=>`${X(yr)},${ry(yr<1897?0:rid[i])}`).join(' ');
  const c1=`<svg class="hchart" viewBox="0 0 ${CW} ${CH}" role="img" aria-label="1日の乗客の移り変わり">${ax(RM,40,v=>v+'千')}<polyline points="${rp}" fill="none" stroke="var(--rail)" stroke-width="2.5"/>${mk}<circle cx="${X(y)}" cy="${ry(ride)}" r="4.5" fill="var(--rail)"/><text class="lb" x="${l+4}" y="${t+10}">1日の乗客（全駅の乗車）</text></svg>`;
  const PM=700,py=v=>t+(1-v/PM)*(CH-t-b),keys=Object.keys(Hs.pop);let acc=Y.map(()=>0);const areas=[];
  for(const k of keys){const lo=acc.slice(),hi=acc.map((a,i)=>a+Hs.pop[k][i]);acc=hi;areas.push(`<path d="M${Y.map((yr,i)=>`${X(yr)},${py(hi[i])}`).join(' L')} L${Y.slice().reverse().map((yr,i)=>`${X(yr)},${py(lo[lo.length-1-i])}`).join(' L')}Z" fill="${TW[k].color}" opacity=".8"><title>${TW[k].name}</title></path>`);}
  const c2=`<svg class="hchart" viewBox="0 0 ${CW} ${CH}" role="img" aria-label="市町村ごとの人口の移り変わり">${ax(PM,175,v=>v+'千')}${areas.join('')}${mk}<text class="lb" x="${l+4}" y="${t+10}">沿線6市町村の人口（積み上げ）</text></svg>`;
  // 年表（沿線 ｜ 年 ｜ 姉妹港）
  const tl=Hs.events.map((e,i)=>{const st=e.y>y?'':(era&&e.y>=era.from&&e.y<=era.to?'now':'past');return `<div class="tlr"><span class="yr" data-y="${e.y}">${e.y}</span><button type="button" class="ev ${e.side} ${st}" data-y="${e.y}">${e.side==='both'?`<b class="by">${e.y}年　</b>`:''}${e.tag?`<i>${esc(e.tag)}</i>`:''}${esc(e.t)}${(()=>{const n=(Hs.plates||[]).findIndex(x=>x.y===e.y&&e.side!=='sister');return n>=0?`<span class="ph">［図${n+1}］</span>`:'';})()}</button></div>`;}).join('');
  const SI=Hs.sister;
  $('#v-history').innerHTML=`<div class="sheet" style="margin-top:16px"><h2>みなと川沿線の歩み（1885〜2026）</h2>
    <p class="hint" style="max-width:72ch">港と城下町を結ぶ小さな蒸気鉄道から、1日12万人が乗る電鉄へ。日本の地方の鉄道がたどってきた道に似せた架空の歴史です。右の列は、港浜市の姉妹港<b>${esc(SI.name)}</b>（${esc(SI.country)}）の歩み。${esc(SI.about)}</p>
    <div class="hy-ctl"><span class="hy-year" id="hyY">${y}</span><input type="range" id="hyR" min="1885" max="2026" step="1" value="${y}" aria-label="年"><button type="button" class="hy-play" id="hyP">${cur.hyPlay?'■ 止める':'▶ 1885年から見る'}</button></div>
    <div class="eras">${Hs.eras.map(e=>`<button type="button" data-era="${e.from}" aria-pressed="${e===era}"><small>${e.from}〜${e.to===2026?'いま':e.to}</small>${esc(e.name)}</button>`).join('')}</div>
    <div class="hy-top"><div class="hy-era"><h3>${esc(era.name)}</h3><p>${esc(era.text)}</p>${ykChips(DATA.yukari.items.filter(x=>x.y>=era.from&&x.y<=era.to),'この時代に生まれたもの・人')}</div>
    ${(()=>{const PL=Hs.plates||[],k=PL.map((x,n)=>x.y<=y?n:-1).filter(n=>n>=0).pop();if(k==null)return '<div></div>';const pl=PL[k];
      return `<figure class="plate"><a href="${Hs.platesFull}" target="_blank" rel="noopener"><img src="${pl.src}" alt="${esc(pl.t)}（${pl.y}年）の挿絵"></a><figcaption><b>図${k+1}　${esc(pl.t)}（${pl.y}年）</b>${esc(pl.c)}<small>${esc(Hs.platesNote)}</small></figcaption></figure>`;})()}</div>
    <div class="kv" style="margin-top:4px"><div><dt>沿線の人口</dt><dd class="num">${fmt(popT*1000/1e4,1)}<small>万人</small></dd></div><div><dt>1日の乗客</dt><dd class="num">${y<1897?'—':fmt(ride*1000/1e4,1)}<small>${y<1897?'まだ鉄道はない':'万人'}</small></dd></div>
      <div><dt>中央→港の最速</dt><dd class="num">${fast==null?'—':fast}<small>${fast==null?'':'分'}</small></dd></div><div><dt>走っていた電車</dt><dd style="font-size:14px">${esc(era.train)}</dd></div></div>
    <div class="scroll" style="margin-top:12px"><svg class="hmap" viewBox="0 0 860 250" role="img" aria-label="${y}年の路線">${g.join('')}</svg></div>
    <div class="grid2"><div>${c1}</div><div>${c2}<div class="legend">${keys.map(k=>`<span><i style="background:${TW[k].color}"></i>${TW[k].name}<b>${fmt(lin(Hs.pop[k],y),1)}千</b></span>`).join('')}</div></div></div>
    <div class="tl-h"><span>みなと川沿線</span><span></span><span>姉妹港 ${esc(SI.name)}</span></div>
    <div class="tl" id="hyTl">${tl}</div>
    <p class="note">数字と出来事はすべて架空です。日本の地方の鉄道によくある流れ（軽便鉄道→電化→戦時の統合→複線化とラッシュ→車社会と赤字の支線→観光とインバウンド）と、オランダの港町の歩み（外国への技師の派遣→戦災→コンテナ化で旧港がさびれる→倉庫街の再生→路面電車の復活）に似せています。2026年の数字は、ゲームの標準ダイヤとこのカルテのほかのタブに合わせています。</p></div>`;
  const setY=v=>{cur.year=Math.max(1885,Math.min(2026,v));history();};
  $('#hyR').addEventListener('input',e=>{stopPlay();setY(Number(e.target.value));});
  $('#v-history').querySelectorAll('[data-era]').forEach(b=>b.addEventListener('click',()=>{stopPlay();const e=Hs.eras.find(x=>x.from===Number(b.dataset.era));setY(e.to===2026?2026:Math.round((e.from+e.to)/2));}));
  $('#v-history').querySelectorAll('#hyTl [data-y]').forEach(b=>b.addEventListener('click',()=>{stopPlay();setY(Number(b.dataset.y));}));
  $('#hyP').addEventListener('click',()=>{if(cur.hyPlay){stopPlay();history();return;}if(cur.year>=2026)cur.year=1885;cur.hyPlay=setInterval(()=>{if(cur.view!=='history'||cur.year>=2026){stopPlay();if(cur.view==='history')history();return;}cur.year++;history();},matchMedia('(prefers-reduced-motion: reduce)').matches?400:110);history();});}
function stopPlay(){if(cur.hyPlay){clearInterval(cur.hyPlay);cur.hyPlay=null;}}

/* ---- 名所・名産・人物：歴史からたどる、建物・街並み・名産品・人物（すべて架空） ---- */
function picHtml(im){return `<figure class="pic"><a href="${im.full}" target="_blank" rel="noopener"><img src="${im.src}" alt="${esc(im.alt)}" loading="lazy"></a><figcaption><b>${esc(im.caption)}</b><span>${esc(im.note)}</span><a href="${im.full}" target="_blank" rel="noopener">雑誌のページ全体を見る</a></figcaption></figure>`;}
const ykImg=name=>Object.values(DATA.images||{}).find(im=>(im.yk||[]).includes(name));
const YKC={build:'#a5533f',town:'#2f5d8a',food:'#c9a33f',person:'#2f8a86'};
function ykChips(list,title){if(!list.length)return '';return `<h3 style="margin-top:12px">${title}</h3><div class="ykchips">${list.map(x=>`<button type="button" data-yk="${esc(x.name)}"><i style="background:${YKC[x.cat]}"></i>${esc(x.name)}</button>`).join('')}</div>`;}
function openYk(name){cur.yk={...(cur.yk||{}),cat:'',st:'',focus:name};setView('yukari');setTimeout(()=>{const el=document.querySelector(`.yk[data-name="${CSS.escape(name)}"]`);if(el)el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});},60);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-yk]');if(b)openYk(b.dataset.yk);});
function yukari(){const Y=DATA.yukari,f=cur.yk||(cur.yk={cat:'',st:'',sort:'year'});
  let list=Y.items.filter(x=>(!f.cat||x.cat===f.cat)&&(!f.st||x.st===f.st));
  list=list.slice().sort((a,b)=>f.sort==='st'?ORD.indexOf(a.st)-ORD.indexOf(b.st)||a.y-b.y:a.y-b.y);
  const eraOf=y=>(DATA.history.eras.find(e=>y>=e.from&&y<=e.to)||{name:'城下町の時代'}).name;
  const card=x=>{const im=ykImg(x.name);return `<article class="yk${f.focus===x.name?' hl':''}" data-name="${esc(x.name)}"><div class="bd" style="background:${YKC[x.cat]}"></div>${im?`<a href="${im.full}" target="_blank" rel="noopener" title="${esc(im.note)}"><img class="ph" src="${im.src}" alt="${esc(im.alt)}" loading="lazy" style="object-position:${(im.pos||{})[x.name]||'center 55%'}"></a>`:''}<div class="in">
      <span class="cat" style="color:${YKC[x.cat]}">${esc(x.catName)}</span><h4>${esc(x.name)}${x.kana?`<small>${esc(x.kana)}${x.life?'・'+esc(x.life):''}</small>`:''}</h4>
      <div class="lk"><button type="button" data-gost="${x.st}">${esc(S[x.st].name)}駅</button><button type="button" data-goy="${x.y}">${x.y}年・${esc(eraOf(x.y))}</button></div>
      <p>${esc(x.text)}</p><p class="now"><b>いま</b>${esc(x.now)}</p>${im?`<p class="now" style="border:0;padding:0">写真はAIで描いたイメージです。</p>`:''}</div></article>`;};
  const cnt=k=>Y.items.filter(x=>x.cat===k).length;
  $('#v-yukari').innerHTML=`<div class="sheet" style="margin-top:16px"><h2>歴史からたどる 名所・名産・人物</h2>
    <p class="hint" style="max-width:72ch">「歴史」の出来事から生まれた、建物・街並み・名産品・人物。すべて架空です。駅を押すとその駅のページへ、年を押すと「歴史」のその年へ移ります。</p>
    <div class="yk-f"><button type="button" data-cat="" aria-pressed="${!f.cat}">すべて ${Y.items.length}</button>${Object.entries(Y.cats).map(([k,n])=>`<button type="button" data-cat="${k}" aria-pressed="${f.cat===k}"><span style="color:${f.cat===k?'inherit':YKC[k]}">●</span> ${n} ${cnt(k)}</button>`).join('')}
      <span class="sep"></span><button type="button" data-sort="year" aria-pressed="${f.sort!=='st'}">年の順</button><button type="button" data-sort="st" aria-pressed="${f.sort==='st'}">駅の順</button></div>
    <div class="yk-f" style="margin-top:-4px"><button type="button" data-fst="" aria-pressed="${!f.st}">全駅</button>${ORD.filter(k=>Y.items.some(x=>x.st===k)).map(k=>`<button type="button" data-fst="${k}" aria-pressed="${f.st===k}">${esc(S[k].name)}</button>`).join('')}</div>
    ${f.cat==='food'&&DATA.images.meisan?picHtml(DATA.images.meisan):''}
    <div class="yks" style="margin-top:12px">${list.map(card).join('')||'<p class="hint">この条件のものはありません。</p>'}</div></div>`;
  const V=$('#v-yukari');
  V.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{f.cat=b.dataset.cat;f.focus=null;yukari();}));
  V.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{f.sort=b.dataset.sort;yukari();}));
  V.querySelectorAll('[data-fst]').forEach(b=>b.addEventListener('click',()=>{f.st=b.dataset.fst;f.focus=null;yukari();}));
  V.querySelectorAll('[data-gost]').forEach(b=>b.addEventListener('click',()=>{cur.st=b.dataset.gost;setView('station');}));
  V.querySelectorAll('[data-goy]').forEach(b=>b.addEventListener('click',()=>{cur.year=Number(b.dataset.goy)<1885?1885:Number(b.dataset.goy);setView('history');}));}

/* ---- 施設の一覧表 ---- */
function table(){let rows='',last='';
  for(const f of DATA.facilities){if(f.genre!==last){rows+=`<tr><td class="g sticky" colspan="1">${esc(f.genre)}</td>${ORD.map(()=>'<td class="g"></td>').join('')}<td class="g"></td></tr>`;last=f.genre;}
    const m=rowMax(f);rows+=`<tr><td class="sticky">${esc(f.item)}<span style="color:var(--muted);font-size:11px">（${esc(f.unit)}）</span></td>${ORD.map(s=>{const v=f.v[s],a=m?v/m:0,c=TW[S[s].town].color;
      return `<td class="v" style="background:${v?`color-mix(in srgb, ${c} ${Math.round(8+a*62)}%, transparent)`:'transparent'};${a>0.6?'color:#fff;':''}${v?'':'color:var(--muted)'}">${v?fmt(v):'·'}</td>`;}).join('')}<td class="v">${fmt(rowSum(f))}</td></tr>`;}
  $('#v-table').innerHTML=`<div class="sheet" style="margin-top:16px"><h2>駅ごとの施設の数</h2><p class="hint">色の濃さは、その施設が沿線でいちばん多い駅を100としたときの多さ。色は駅が属する市町村</p>
    <div class="scroll" style="margin-top:8px"><table class="heat"><thead><tr><th class="sticky">施設</th>${ORD.map(s=>`<th>${esc(S[s].name)}</th>`).join('')}<th>沿線合計</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}

function setView(v){cur.view=v;try{history.replaceState(null,'','#'+v);}catch(e){}render();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['station','towns','money','table','history','yukari'].includes(h)&&h!==cur.view){cur.view=h;render();}});
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===cur.view)));
  for(const v of ['station','towns','money','table','history','yukari'])$('#v-'+v).hidden=v!==cur.view;
  $('#routeBox').hidden=!(cur.view==='station');drawRoute();
  ({station,towns,money,table,history,yukari})[cur.view]();}
render();
</script>

</body>
</html>
