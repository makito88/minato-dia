<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>峠駅 ホーム試作</title>
<style>
  :root{--panel:rgba(20,26,34,.72);--ink:#f3f1ea;--sub:#b9c3cc;--acc:#c9a35c}
  html,body{margin:0;height:100%;background:#151a20;overflow:hidden;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
  #hud{position:fixed;left:12px;top:12px;background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.6;max-width:min(340px,calc(100vw - 48px))}
  #hud b{font-size:14px}#hud small{color:var(--sub)}
  #ctl{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  #ctl button,#ctl2 button{font:inherit;font-size:12px;background:#3b4652;color:var(--ink);border:1px solid #56626e;border-radius:5px;padding:2px 8px;cursor:pointer}
  #ctl button[aria-pressed=true],#ctl2 button[aria-pressed=true]{background:var(--acc);color:#1d1a14;border-color:var(--acc)}
  .row{margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:120px;accent-color:var(--acc)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <b>峠駅（仮）｜ホームの場面 2.5D試作</b><br>
  <span id="st">読み込み中…</span><br>
  <small>ダイヤとは未連動（一定時間ごとにくり返し）</small>
  <div id="ctl"><button data-m="1" aria-pressed="true">×1</button><button data-m="4">×4</button><button id="again">最初から</button></div>
  <div id="ctl2" class="row">車両 <button data-t="gem">Gemini の絵</button><button data-t="gpt">ChatGPT の絵</button><button data-t="3d">3D</button></div>
  <div class="row"><label for="sz">側面の大きさ</label> <input id="sz" type="range" min="0.5" max="1.1" step="0.01"> <span id="szv"></span></div>
  <div class="row" id="szeRow"><label for="sze">正面の大きさ</label> <input id="sze" type="range" min="0.5" max="1.2" step="0.01"> <span id="szev"></span></div>
</div>
<script>
/* 峠駅 ホームの場面（2.5D 試作）
   1枚の背景画（生成AIで描いた絵）の上に、列車の真横の絵を「背景画と同じ遠近」で貼って動かす。
   遠近は背景画から測った値：消失点 (VX,VY)、焦点距離 F（px）、目の高さ E（レール面から m）。
   画面の点 = (VX + F·X/z, VY + F·(E−h)/z)。X は目から横の距離（左が負）、h は高さ、z は奥行き（m）。 */
const IMG='../../assets/images/plat25d/';
const BW=1672,BH=941;                    // 背景画の大きさ（この座標で描いてから画面に合わせる）
const VX=1046,VY=490,F=1810,E=1.59;      // 背景画から測った遠近（遠くまでの2本のレールの交点＝消失点、レールの間隔、枕木の間隔）
const KP=-0.79;                          // ホームの縁の線の傾き（Δx/Δy）。これより右下はホームに隠れる
const XC=-2.14,CW=2.9;                   // 線路の中心の横位置（目から左へ 2.14m）、車体の幅（m）
const XTS=()=>XC+CW*SIZE/2;              // 列車のホーム側の面の横位置：車体の中心を線路の中心にそろえる
// 列車の絵：レール面の行 317、車体の高さ 223px＝3.65m。絵の車両は短いので横を 1.4 倍にのばす
// 列車の大きさの倍率。AIの絵の遠近や縦横比は実寸どおりではないので、見た目で合わせる（画面のスライダーか ?size=0.68&endsize=0.82）
// SIZE＝側面、SIZE_E＝最後尾の妻面（側面と妻面の絵で車体の縦横比が違うため別々に合わせる）
const QS=new URLSearchParams(location.search);
let SIZE=0.77,SIZE_E=0.88;   // 実際の値は車両の絵ごとの初期値（SETS の size / endSize）から入る
// 車両の絵（2組）：roof＝側面の絵で屋根の行（レール面は絵の最下行）、endBody＝妻面の絵で車体の左右の端の列
// size / endSize＝その絵で見た目がちょうどよい大きさ（側面・正面）。スライダーで変えると、その絵の値として覚える
const SETS={gem:{name:'Gemini',side:'gem_side.webp',end:'gem_end.webp',roof:22,endBody:[18,1680],size:0.77,endSize:0.88},
            gpt:{name:'ChatGPT',side:'gpt_side.webp',end:'gpt_end.webp',roof:19,endBody:[10,872],size:0.77,endSize:0.88},
            '3d':{name:'3D',size:0.77,endSize:0.88}};   // 3D：画像から作った気動車の立体（assets/models/plat25d/）。大きさは側面のスライダーで全体を縮める
const CAR_M=21.3,GAP_M=0.6;   // 3D の1両の長さ・連結のすき間（m）
const ROOF_M=3.7,LEN_M=42;   // 気動車：レール面から屋根まで 3.7m、2両で 42m（絵の車両が短いぶんは横にのばして合わせる）
let cur=({gpt:'gpt','3d':'3d'})[new URLSearchParams(location.search).get('train')]||'gem';
if(QS.get('size'))SETS[cur].size=Number(QS.get('size'));if(QS.get('endsize'))SETS[cur].endSize=Number(QS.get('endsize'));
function useSet(k){cur=k;SIZE=SETS[k].size;SIZE_E=SETS[k].endSize;}
useSet(cur);
function TRG(){if(cur==='3d')return{L:(2*CAR_M+GAP_M)*SIZE};const im=SETS[cur].sideImg,rail=im.height,ppm=(rail-SETS[cur].roof)/(ROOF_M*SIZE);return{rail,ppm,stretch:LEN_M*SIZE*ppm/im.width,L:LEN_M*SIZE};}
const C={stopBack:-10,vIn:11,dec:0.9,dwell:14,acc:0.8,gapBefore:6,gapAfter:7};   // 停車位置（stopBack：最後尾がカメラの何m後ろか。負なら前。-10＝最後尾が目の前10mに止まり、編成全体と妻面が見える）、進入 40km/h、減速度、停車時間、加速度、前後の間（秒）

const cv=document.getElementById('cv'),g=cv.getContext('2d');
const load=n=>new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=IMG+n;});
let base,leaves,mult=1,t0=0,simT=0,last=0,ptr={x:0,y:0},pp={x:0,y:0};

function resize(){const d=Math.min(2,devicePixelRatio||1);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);}
addEventListener('resize',resize);resize();
addEventListener('pointermove',e=>{ptr.x=e.clientX/innerWidth*2-1;ptr.y=e.clientY/innerHeight*2-1;});

/* 列車の動き：奥行き z（先頭）を時刻から求める。後ろから入ってきて減速・停車し、加速して奥へ去る */
function trainState(t){const L=TRG().L,stopZ=L-C.stopBack,dIn=C.vIn*C.vIn/(2*C.dec),tIn=C.vIn/C.dec,tOut=Math.sqrt(2*(500+L)/C.acc);
  let s=t-C.gapBefore;
  if(s<0)return{z:null,msg:'列車を待っています',L};
  if(s<tIn){const v=C.vIn-C.dec*s;return{z:stopZ-v*v/(2*C.dec),msg:'列車が到着します',L};}
  s-=tIn;if(s<C.dwell)return{z:stopZ,msg:'停車中',L};
  s-=C.dwell;if(s<tOut)return{z:stopZ+0.5*C.acc*s*s,msg:'発車しました',L};
  s-=tOut;if(s<C.gapAfter)return{z:null,msg:'列車を待っています',L};
  return{reset:true,L};}
const cycleLen=()=>{const L=TRG().L;return C.gapBefore+C.vIn/C.dec+C.dwell+Math.sqrt(2*(500+L)/C.acc)+C.gapAfter;};

/* 列車の側面：画面の縦の列ごとに「その列に映る奥行き z」を求め、絵のその位置を縦に引きのばして描く */
function drawTrain(zf,L){const XT=XTS(),TR=TRG(),train=SETS[cur].sideImg,zr=zf-L,W=train.width,H=train.height,hTop=TR.rail/TR.ppm,hBot=(TR.rail-H)/TR.ppm,pxm=TR.ppm/TR.stretch;
  g.save();g.beginPath();g.moveTo(-4000,-4000);g.lineTo(VX,-4000);g.lineTo(VX,VY);g.lineTo(VX+KP*(4000-VY),4000);g.lineTo(-4000,4000);g.closePath();g.clip();   // ホームに隠れる所は描かない
  const step=2;
  for(let u=-60;u<VX-1;u+=step){const z=F*XT/(u-VX);if(z<0.3||z<zr||z>zf)continue;   // XT＝縮めた車体のホーム側の面（中心は線路の中心）
    const z2=F*XT/(u+step-VX),tx=(z-zr)*pxm,tw=Math.max(1,Math.abs(z2-z)*pxm);if(tx>=W)continue;
    const yT=VY+F*(E-hTop)/z,yB=VY+F*(E-hBot)/z;
    g.drawImage(train,Math.min(tx,W-1),0,Math.min(tw,W-tx),H,u,yT,step+0.6,yB-yT);}
  if(zr>0.4)drawEnd(zr);   // 最後尾の妻面（こちらを向いている）
  g.restore();}
// 最後尾の妻面：真後ろから描いた絵を、その奥行きの大きさに縮めて置く（こちらを向いた面なので、ただの拡大縮小でよい）
function drawEnd(z){const S=SETS[cur],im=S.endImg,bw=S.endBody[1]-S.endBody[0],mpp=CW*SIZE_E/bw,k=F/z;   // 妻面の中心も線路の中心に
  const xL=VX+F*(XC-CW*SIZE_E/2-S.endBody[0]*mpp)/z,yB=VY+F*(E-0.05)/z,w=im.width*mpp*k,h=im.height*mpp*k;
  g.drawImage(im,xL,yB-h,w,h);}

/* 3D の気動車：背景画と同じ遠近のカメラで、背景画と同じ大きさの見えない画面に描き、それを貼る
   カメラはレール面から E の高さで、線路と同じ向き（奥＝−z）を向く。画面の中心のずれ（消失点）と焦点距離を投影行列にそのまま入れる */
let T3=null;
async function init3D(){const THREE=await import('../cab3d/lib/three.module.min.js');const dir='../../assets/models/plat25d/';
  const [meta,buf,tex]=await Promise.all([fetch(dir+'kiha.json').then(r=>r.json()),fetch(dir+'kiha.bin').then(r=>r.arrayBuffer()),new THREE.TextureLoader().loadAsync(dir+'kiha.webp')]);
  tex.colorSpace=THREE.SRGBColorSpace;tex.flipY=false;tex.anisotropy=8;   // glTF の UV の向き
  const e=meta.kiha,F32=new Float32Array(buf),U32=new Uint32Array(buf),sl=(a,[o,n])=>a.subarray(o,o+n),geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(sl(F32,e.p),3));geo.setAttribute('uv',new THREE.BufferAttribute(sl(F32,e.u),2));geo.setIndex(new THREE.BufferAttribute(sl(U32,e.i),1));geo.computeVertexNormals();
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setSize(BW,BH,false);r.outputColorSpace=THREE.SRGBColorSpace;r.setClearColor(0,0);
  const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight('#fff6e6','#7d725f',1.85));const sun=new THREE.DirectionalLight('#ffe9c8',1.7);sun.position.set(-6,10,4);sc.add(sun);   // 背景画の光（左上からのやわらかい日差し）に合わせる
  const mat=new THREE.MeshLambertMaterial({map:tex}),grp=new THREE.Group();
  const shm=new THREE.MeshBasicMaterial({color:0x1a1408,transparent:true,opacity:0.35,depthWrite:false});   // 車体の下の薄い影
  for(let i=0;i<2;i++){const m=new THREE.Mesh(geo,mat);m.position.z=CAR_M/2+i*(CAR_M+GAP_M);if(i)m.rotation.y=Math.PI;grp.add(m);
    const sh=new THREE.Mesh(new THREE.PlaneGeometry(3.1,CAR_M),shm);sh.rotation.x=-Math.PI/2;sh.position.set(0,0.02,m.position.z);grp.add(sh);}
  sc.add(grp);
  const cam=new THREE.PerspectiveCamera(30,BW/BH,0.3,3000);cam.position.set(0,E,0);cam.updateMatrixWorld();
  const n=0.3,f=3000,P=cam.projectionMatrix;   // 画面の点 = (VX + F·x/z, VY − F·y/z) になる投影
  P.set(2*F/BW,0,1-2*VX/BW,0, 0,2*F/BH,2*VY/BH-1,0, 0,0,-(f+n)/(f-n),-2*f*n/(f-n), 0,0,-1,0);cam.projectionMatrixInverse.copy(P).invert();
  T3={r,sc,cam,grp};}
// 先頭の奥行き zf（m）に列車を置いて描き、ホームに隠れる所を除いて背景画に重ねる
function draw3D(zf){if(!T3)return;T3.grp.scale.setScalar(SIZE);T3.grp.position.set(XC,0,-zf);T3.r.render(T3.sc,T3.cam);
  g.save();g.beginPath();g.moveTo(-4000,-4000);g.lineTo(VX,-4000);g.lineTo(VX,VY);g.lineTo(VX+KP*(4000-VY),4000);g.lineTo(-4000,4000);g.closePath();g.clip();
  g.drawImage(T3.r.domElement,0,0,BW,BH);g.restore();}

/* 木漏れ日：ホームの床に、ゆっくり動く光のまだら */
function komorebi(t){g.save();g.beginPath();g.moveTo(VX,VY);g.lineTo(VX+KP*(BH+200-VY),BH+200);g.lineTo(BW+200,BH+200);g.lineTo(BW+200,VY);g.closePath();g.clip();
  g.globalCompositeOperation='soft-light';
  for(let i=0;i<26;i++){const r1=((i*73)%97)/97,r2=((i*41)%89)/89,x=VX+60+r1*(BW-VX+40)+Math.sin(t*0.35+i)*14,y=VY+120+r2*(BH-VY-80)+Math.cos(t*0.27+i*1.7)*8,
    rad=30+r2*70,a=0.32+0.25*Math.sin(t*(0.6+r1*0.8)+i*2.3);
    const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,`rgba(255,240,200,${Math.max(0,a)})`);gr.addColorStop(1,'rgba(255,240,200,0)');g.fillStyle=gr;g.fillRect(x-rad,y-rad,rad*2,rad*2);}
  g.restore();}

function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.1,(now-(last||now))/1000);last=now;simT+=dt*mult;const t=now/1000;
  pp.x+=(ptr.x-pp.x)*Math.min(1,dt*3);pp.y+=(ptr.y-pp.y)*Math.min(1,dt*3);
  // 画面に背景画全体が入るように合わせる（余った所は暗く）
  const s=Math.min(cv.width/BW,cv.height/BH),ox=(cv.width-BW*s)/2,oy=(cv.height-BH*s)/2;
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#151a20';g.fillRect(0,0,cv.width,cv.height);
  g.save();g.beginPath();g.rect(ox,oy,BW*s,BH*s);g.clip();
  // 奥の層（背景画・列車）はわずかに、手前の葉は大きく動かす（視差）
  const Z=1.035,bx=-pp.x*9,by=-pp.y*5;g.setTransform(s*Z,0,0,s*Z,ox-BW*s*(Z-1)/2+bx*s,oy-BH*s*(Z-1)/2+by*s);
  g.drawImage(base,0,0,BW,BH);
  let st=trainState(simT);if(st.reset){simT=0;st=trainState(0);}
  if(st.z!=null){if(cur==='3d')draw3D(st.z);else drawTrain(st.z,st.L);}
  komorebi(t);
  g.setTransform(s,0,0,s,ox,oy);
  // 手前の葉：画面の左上から、ゆっくりそよぐ
  const lw=BW*0.62,lh=lw*leaves.height/leaves.width,ang=Math.sin(t*0.7)*0.007+Math.sin(t*1.9+1)*0.003;
  g.save();g.translate(-30-pp.x*26,-24-pp.y*14);g.rotate(ang);g.drawImage(leaves,0,0,lw,lh);g.restore();
  // ごく弱い周辺減光
  const vg=g.createRadialGradient(BW/2,BH/2,BH*0.45,BW/2,BH/2,BH*1.0);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(20,24,30,.28)');g.fillStyle=vg;g.fillRect(0,0,BW,BH);
  g.restore();
  document.getElementById('st').textContent=st.msg;window.__ready=true;}

document.querySelectorAll('#ctl button[data-m]').forEach(b=>b.onclick=()=>{mult=Number(b.dataset.m);document.querySelectorAll('#ctl button[data-m]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
document.getElementById('again').onclick=()=>{simT=0;};
// 車両の絵の切り替えと、大きさのスライダー
function markUI(){document.getElementById('szeRow').style.display=cur==='3d'?'none':'';document.querySelectorAll('#ctl2 button[data-t]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===cur)));document.getElementById('szv').textContent=SIZE.toFixed(2);document.getElementById('sz').value=SIZE;document.getElementById('szev').textContent=SIZE_E.toFixed(2);document.getElementById('sze').value=SIZE_E;}
document.querySelectorAll('#ctl2 button[data-t]').forEach(b=>b.onclick=()=>{if(b.dataset.t==='3d'&&!T3)return;useSet(b.dataset.t);markUI();});
document.getElementById('sz').oninput=e=>{SIZE=SETS[cur].size=Number(e.target.value);markUI();};
document.getElementById('sze').oninput=e=>{SIZE_E=SETS[cur].endSize=Number(e.target.value);markUI();};
window.__setT=v=>{simT=v;};   // 確認用：場面の時刻を指定
const ready3D=init3D().catch(e=>{console.warn('3D',e);const b=document.querySelector('#ctl2 button[data-t="3d"]');if(b){b.disabled=true;b.title='3D を読み込めませんでした';}if(cur==='3d')useSet('gem');});
Promise.all([ready3D,load('toge_base.webp'),load('leaves.webp'),...Object.values(SETS).filter(S=>S.side).flatMap(S=>[load(S.side).then(i=>S.sideImg=i),load(S.end).then(i=>S.endImg=i)])]).then(([,a,c])=>{base=a;leaves=c;markUI();
  const q=new URLSearchParams(location.search);if(q.get('t'))simT=Number(q.get('t'));requestAnimationFrame(frame);})
  .catch(()=>{document.getElementById('st').textContent='画像を読み込めませんでした（HTTP で開いてください）';});
</script>
</body>
</html>
